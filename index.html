function shortDate(key) {
  const [year, month, day] = key.split("-");
  const months = ["janv.", "févr.", "mars", "avril", "mai", "juin",
                  "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  return Number(day) + " " + months[Number(month) - 1];
}

// ---- Report ----
// One section per list, every word with its level. Words keep their lesson
// order rather than being ranked worst first: this is a picture of the work
// done, not a list of failures.
function relativeDate(timestamp) {
  if (!timestamp) return "jamais révisé";
  const days = Math.floor((Date.now() - timestamp) / 86400000);
  if (days <= 0) return "aujourd'hui";
  if (days === 1) return "hier";
  if (days < 7) return "il y a " + days + " jours";
  if (days < 14) return "la semaine dernière";
  if (days < 60) return "il y a " + Math.floor(days / 7) + " semaines";
  return "il y a " + Math.floor(days / 30) + " mois";
}

/* Somebody's book, read without becoming them: a parent looks over a
   child's work and the child's own save is not touched. */
function bookOf(id) {
  try {
    const raw = localStorage.getItem(PROFILES.keyFor(STORE_PLAIN, id));
    return Store.adopt(raw ? JSON.parse(raw) : null);
  } catch (error) {
    return emptyProgress();
  }
}

/* ---- The report ----
   A child's own report is meant to be read at a glance: one line per
   question — the English word, or the sum as it is asked — and the five
   dots beside it. Nothing else. No answer (that is what is being
   learnt), no tally, no date, no rule between the lines: what is wanted
   is to see at once what is solid and what is not.

   A parent reading a child's book gets the tally and the date as well,
   because those are the questions a parent actually asks. */
function renderReport(who) {
  nowShowing("report");
  const child = who ? PROFILES.all().find(one => one.id === who) : null;
  const book = child ? bookOf(child.id) : progress;
  const of = subjectOf(child ? child.grade : (PROFILE && PROFILE.grade));
  const record = word => book.words[word.key] || { level: 0, seen: 0, ok: 0, last: 0 };
  const noun = many => of === "maths"
    ? (many > 1 ? "calculs" : "calcul")
    : (many > 1 ? "mots" : "mot");

  const sections = listsFor(of).map(lesson => {
    const levels = lesson.items.reduce((sum, word) => sum + record(word).level, 0);
    const ratio = lesson.items.length ? levels / (lesson.items.length * MAX_LEVEL) : 0;
    const mastered = lesson.items.filter(word => record(word).level >= MAX_LEVEL).length;

    const rows = lesson.items.map(word => {
      const seen = record(word);
      /* The question, and only the question: an English word is what is
         being learnt, a sum is what is being asked. The answer on the
         page would make the report a page of answers. */
      const asked = lesson.of === "sums" ? word.fr : word.en[0];
      const meta = !child ? "" :
        '<span class="meta">' + (seen.seen
          ? seen.ok + " bonne" + (seen.ok > 1 ? "s" : "") + " réponse" +
            (seen.ok > 1 ? "s" : "") + " sur " + seen.seen + " · " + relativeDate(seen.last)
          : "jamais révisé") + '</span>';
      return '<li><span><span class="en">' + esc(asked) + '</span>' + meta + '</span>' +
        '<span class="dots">' + levelDots(seen.level) + '</span></li>';
    }).join("");

    return '<section class="card">' +
        '<p class="label" style="margin-bottom:0"><b>' + esc(lesson.title) + '</b></p>' +
        '<span class="bar"><span style="width:' + Math.round(ratio * 100) + '%"></span></span>' +
        '<span class="done">' + mastered + ' ' + nounOf(lesson, mastered) +
          ' acquis sur ' + lesson.items.length + '</span>' +
        '<ul class="report' + (child ? '' : ' plain') + '">' + rows + '</ul>' +
      '</section>';
  }).join("");

  screen.innerHTML =
    '<section class="card">' +
      (child
        ? '<p class="label" style="margin:0">' + faceOf(child, "small") + '<b>' +
            esc(child.name) + '</b>' + gradeBadge(child.grade) + '</p>'
        : '<p class="label" style="margin:0">Chaque ' + noun(1) +
          ' se retient un peu mieux à chaque bonne réponse. Cinq points remplis, ' +
          'il est acquis.</p>') +
    '</section>' + sections;

  window.scrollTo(0, 0);
}

// ---- Round setup ----
function startRound(lessonId) {
  state.lesson = lessonId;
  state.stampEarned = false;
  state.roundPoints = 0;
  state.roundCoins = 0;
  state.rankBefore = rankOf(progress.points).index;
  const pool = poolFor(lessonId);
  // The daily session is exactly as long as what is left of the goal, so
  // finishing it finishes the day. Free practice keeps the usual length.
  const goal = goalState();
  const length = lessonId === "!due" && !goal.complete
    ? Math.max(5, Math.min(GOAL_CEILING, goal.goal - goal.done))
    : ROUND_LENGTH;

  // The daily session takes the most urgent words first and, when fewer are
  // due than the goal asks for, tops up with those closest to falling due.
  // Without that top-up a quiet day could not reach the floor, and the
  // stamp would be out of reach through no fault of the pupil.
  // Free practice keeps the weighted draw, which favours overdue, weak and
  // long-unseen words without always serving the same ones.
  const picked = lessonId === "!due"
    ? shuffle(pool.slice().sort((a, b) => dueIn(a) - dueIn(b)).slice(0, length))
    : drawWords(pool, length);

  /* The day's revision turns the word over: asked one way, then the
     other, then written from the sound alone. Speaking is left out of
     the turn — it wants a microphone and a recogniser that does not
     always hear, and a daily session must never be impossible to
     finish. So is the dictation on a telephone with no English voice,
     for the same reason: there would be nothing to hear. */
  const asked = lessonId === "!due" ? turnAbout() : null;

  state.round = picked.map((word, at) => {
    /* A word whose list named its modes draws one of them, fresh for
       every question. Otherwise it is the mode the menu chose, or, in
       the day's revision, the one whose turn it is. */
    const mode = word.ask ? shuffle(askable(word.ask))[0]
      : asked ? asked[at % asked.length]
      : state.mode;
    const question =
      mode === "mcq" ? buildForward(word, pool) :
      mode === "mcqfr" ? buildReverse(word, pool) :
      // Writing what is heard means writing it from the sound alone: the
      // French word would hand the answer over before the first letter.
      mode === "spell" || mode === "count" ? { word, prompt: "" } :
      // Spoken aloud, and a sum, are both asked in writing.
      { word, prompt: word.fr };
    question.mode = mode;
    return question;
  });
  state.index = 0;
  state.score = 0;
  renderShell();
  showQuestion();
}

/* Of the modes a list names, the ones this telephone can actually ask.
   Listening needs an English voice; where there is none, what is left
   is asked instead — a question nobody can hear is a question nobody
   can answer. */
function askable(modes) {
  if (!englishVoice) pickVoice();
  if (englishVoice) return modes;
  const left = modes.filter(one => one !== "count" && one !== "spell");
  return left.length ? left : ["mcq"];
}

/* The modes the day's revision turns between, in order. Nothing to turn
   between for the sums: there is one way of asking them. */
function turnAbout() {
  if (subject() === "maths") return null;
  if (!englishVoice) pickVoice();
  return englishVoice ? ["mcq", "mcqfr", "spell"] : ["mcq", "mcqfr"];
}

// French prompt, English answers. Distractors come from the same pool and are
// never a synonym of the current word.
function buildForward(word, pool) {
  const answer = shuffle(word.en)[0];
  const banned = new Set([...word.en, ...(word.avoid || [])]);
  /* A word whose answers come in forms ("first" and "1st") is offered
     wrong choices in the form drawn for the right one: three words and
     a figure would hand the answer over. */
  const form = word.forms ? word.en.indexOf(answer) : -1;
  const answersOf = words => (form === -1
    ? words.flatMap(w => w.en)
    : words.filter(w => w.forms).map(w => w.en[form])
  ).filter(a => a && !banned.has(a));
  let others = answersOf(pool);
  // A very short list would not offer enough wrong answers on its own.
  if (others.length < 3) others = answersOf(LESSONS.flatMap(l => l.words));
  const distractors = shuffle([...new Set(others)]).slice(0, 3);
  return { word, prompt: word.fr, answer, options: shuffle([answer, ...distractors]) };
}

// English prompt, French answers. A word whose `avoid` list mentions the
// prompt would also be a correct translation, so it is left out.
function buildReverse(word, pool) {
  const prompt = shuffle(word.en)[0];
  const usable = candidates => candidates.filter(other =>
    other.fr !== word.fr &&
    !(other.avoid || []).includes(prompt) &&
    !other.en.includes(prompt)
  );
  let others = usable(pool);
  if (others.length < 3) others = usable(LESSONS.flatMap(l => l.words));
  const distractors = shuffle(others).slice(0, 3).map(other => other.fr);
  return { word, prompt, answer: word.fr, options: shuffle([word.fr, ...distractors]) };
}

// ---- Quiz shell, shared by both modes ----
function renderShell() {
  nowShowing("round");
  screen.innerHTML =
    '<section class="card">' +
      '<div class="topbar">' +
        '<span class="counter" id="counter"></span>' +
      '</div>' +
      '<div class="track" id="track" aria-hidden="true"></div>' +
      '<p class="prompt" id="prompt"></p>' +
      '<div id="body"></div>' +
    '</section>';
  document.getElementById("track").innerHTML =
    state.round.map(() => '<span class="tick"></span>').join("");
}

function markTrack(result) {
  const ticks = document.getElementById("track").children;
  for (const tick of ticks) tick.classList.remove("now");
  if (result) ticks[state.index].classList.add(result);
  else if (ticks[state.index]) ticks[state.index].classList.add("now");
}

function showQuestion() {
  stopMoving();
  state.locked = false;
  state.attempts = 0;
  markTrack(null);
  document.getElementById("counter").textContent =
    lessonTitle(state.lesson) + " · " + (state.index + 1) + "/" + state.round.length;
  const prompt = document.getElementById("prompt");
  prompt.textContent = state.round[state.index].prompt;
  prompt.hidden = !prompt.textContent;   // the dictation asks nothing in writing
  /* Which mode this question is asked in. It is the one chosen in the
     menu, except in the day's revision, where each question carries its
     own — so everything below reads the question, never the menu. */
  state.asking = state.round[state.index].mode || state.mode;
  if (state.asking === "say") say.render();
  else if (state.asking === "spell") spell.render();
  else if (state.asking === "count") count.render();
  else if (state.asking === "maths") maths.render();
  else mcq.render();
}

/* What happens once a question is answered. A right answer needs no
   further instruction: it is said, it is read, and the next question
   comes on its own. A wrong one waits for the pupil, because there is
   something to look at — and, in the written modes, something to copy
   out before being let on. */
const RIGHT_PAUSE = 1200;    // long enough to read "c'est juste"
const SPOKEN_PAUSE = 1900;   // and, where a word is said aloud, to hear it
let moving = null;

function stopMoving() {
  clearTimeout(moving);
  moving = null;
}

// The button that lets a corrected answer through.
function offerNext() {
  const pass = document.getElementById("pass");
  if (pass) pass.remove();
  const next = document.getElementById("next");
  if (!next) return;
  next.textContent = nextLabel();
  next.hidden = false;
  next.focus();
}

function settled(success) {
  stopMoving();
  if (!success) { offerNext(); return; }
  // Where the answer is read aloud, the pause is the length of the word.
  const aloud = state.asking === "mcq" || state.asking === "mcqfr" || state.asking === "say";
  moving = setTimeout(() => { moving = null; goNext(); },
    aloud ? SPOKEN_PAUSE : RIGHT_PAUSE);
}

function nextLabel() {
  if (state.index === state.round.length - 1) return "Voir le score";
  // What comes next is what this question was: a CE2 who has just heard
  // an English number is not being handed another sum.
  return state.asking === "maths" ? "Calcul suivant" : "Mot suivant";
}

function goNext() {
  if (state.index === state.round.length - 1) showScore();
  else { state.index++; showQuestion(); }
}

function synonymNote(word, shown) {
  const others = word.en.filter(answer => answer !== shown);
  return others.length
    ? '<span class="also">On accepte aussi : ' + esc(others.join(", ")) + '.</span>'
    : "";
}

// ---- Modes 1 and 2: multiple choice, in either direction ----
const mcq = {
  reverse() { return state.asking === "mcqfr"; },

  render() {
    const question = state.round[state.index];
    document.getElementById("body").innerHTML =
      (mcq.reverse() ? '<div class="actions" style="margin-top:0;margin-bottom:18px">' +
        '<button class="text" id="hear">Réécouter la phrase</button></div>' : "") +
      '<div class="stack" id="options"></div>' +
      '<p class="verdict" id="verdict"></p>' +
      '<div class="actions"><button class="text primary" id="next" hidden></button></div>';

    const options = document.getElementById("options");
    question.options.forEach((option, i) => {
      const button = document.createElement("button");
      button.className = "choice option";
      button.type = "button";
      button.innerHTML = '<span class="key">' + (i + 1) + '</span><span class="word"></span>';
      button.querySelector(".word").textContent = option;
      button.addEventListener("click", () => mcq.choose(option, button));
      options.appendChild(button);
    });
    document.getElementById("next").addEventListener("click", goNext);

    if (mcq.reverse()) {
      // The prompt is English here, so it is spoken on arrival and on demand.
      document.getElementById("hear").addEventListener("click", () => speak(question.prompt));
      speak(question.prompt);
    }
  },

  choose(option, button) {
    const question = state.round[state.index];
    // Going French to English, the chosen answer is read aloud every time,
    // including once the question is settled, so pronunciations can be compared.
    if (!mcq.reverse()) speak(option, button);
    if (state.locked) return;
    state.locked = true;

    const success = option === question.answer;
    const change = recordResult(question.word, success);
    button.classList.add(success ? "picked-right" : "picked-wrong");
    markTrack(success ? "right" : "wrong");

    if (!success) {
      for (const other of document.getElementById("options").children) {
        if (other.querySelector(".word").textContent === question.answer) {
          other.classList.add("reveal");
        }
      }
    }

    const verdict = document.getElementById("verdict");
    if (mcq.reverse()) {
      speak(question.prompt);
      const synonyms = question.word.en.filter(answer => answer !== question.prompt);
      verdict.innerHTML =
        (success ? "<b>Bravo.</b> " : "<b>Raté.</b> ") +
        esc(question.prompt) + " = " + esc(question.answer) + "." +
        (synonyms.length
          ? '<span class="also">Se dit aussi : ' + esc(synonyms.join(", ")) + '.</span>'
          : "") +
        levelNote(change);
    } else {
      verdict.innerHTML =
        (success ? "<b>Bravo.</b> " : "<b>Raté.</b> ") +
        esc(question.word.fr) + " = " + esc(question.answer) + "." +
        synonymNote(question.word, question.answer) +
        // Only worth saying while the question is still there to click on.
        (success ? "" : '<span class="also">Clique sur un mot pour l\'entendre à nouveau.</span>') +
        levelNote(change);
    }

    settled(success);
  }
};

/* ---- The on-screen keyboard ----
   A phone's own keyboard guesses the word being typed and offers it
   whole: "to" is enough to see "tomorrow", and a dictation is no longer
   one. No attribute makes every keyboard stop doing it, so where the
   answer is typed with a finger the page brings a keyboard of its own
   and the phone's is kept shut (inputmode="none"). It knows nothing but
   letters, or nothing but figures, and carries the one Valider button.

   A real keyboard guesses nothing, so a computer keeps it and the box
   keeps its button beside it. A tablet with a keyboard plugged in can
   use either: the box still takes what is typed. */
const keypad = {
  wanted() { return matchMedia("(pointer: coarse)").matches; },

  key(value, label, span, extra) {
    return '<button type="button" class="pad-key' + (extra && extra.small ? ' small' : '') + '"' +
      ' data-key="' + value + '" style="grid-column: span ' + span + '"' +
      (extra && extra.name ? ' aria-label="' + extra.name + '"' : '') + '>' + label + '</button>';
  },

  /* The submit button lives in the keyboard, outside the form, and
     reaches it through its form attribute; it keeps the id every mode
     already looks for, to turn it into "Recopier" or to disable it. */
  html(kind, form) {
    const key = keypad.key;
    const row = chars => chars.split("").map(c => key(c, c, 2)).join("");
    const gap = span => '<span style="grid-column: span ' + span + '"></span>';
    const back = span => key("back",
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-5 6M12 9l5 6"/></svg>',
      span, { name: "Effacer" });
    const go = span => '<button type="submit" class="pad-key go" id="check" form="' + form + '"' +
      ' style="grid-column: span ' + span + '">Valider</button>';
    const keys = kind === "digits"
      ? row("123456789") + back(2) + key("0", "0", 2) + go(2)
      : row("qwertyuiop") +
        gap(1) + row("asdfghjkl") + gap(1) +
        gap(3) + row("zxcvbnm") + back(3) +
        key("'", "'", 2, { name: "Apostrophe" }) + key("-", "-", 2, { name: "Trait d'union" }) +
        key(" ", "espace", 10, { small: true }) + go(6);
    return '<div class="keypad ' + kind + '" id="keypad">' + keys + '</div>';
  },

  // Each key writes where the caret is, as a keyboard would.
  wire(input) {
    const pad = document.getElementById("keypad");
    // A key never takes the focus: the caret stays in the box.
    pad.addEventListener("mousedown", event => event.preventDefault());
    // Safari only shows a key pressed down to a page that listens for touches.
    pad.addEventListener("touchstart", () => {}, { passive: true });
    pad.addEventListener("click", event => {
      const button = event.target.closest("[data-key]");
      if (!button || input.disabled) return;
      const start = input.selectionStart;
      const end = input.selectionEnd;
      if (button.dataset.key !== "back") {
        input.setRangeText(button.dataset.key, start, end, "end");
      } else if (start !== end) {
        input.setRangeText("", start, end, "end");
      } else if (start > 0) {
        input.setRangeText("", start - 1, start, "end");
      }
      if (document.activeElement !== input) input.focus();
    });
  }
};

// ---- Mode 2: say the answer ----
/* ---- Mode 4: hear it, write it ----
   Spelling is judged exactly: accents and case are ignored, letters are
   not. The `heard` variants used by the speaking mode are deliberately
   left out here, since "said" for sad is a microphone artefact, not an
   acceptable spelling. A wrong answer has to be copied out correctly
   before moving on, because writing the word once is what fixes it. */
const spell = {
  correctFor(word) { return word.en[0]; },

  matches(word, attempt) {
    const said = normalise(attempt);
    return word.en.some(answer => normalise(answer) === said);
  },

  // Marks, letter by letter, where the attempt parts from the answer.
  diff(answer, attempt) {
    const a = normalise(answer);
    const b = normalise(attempt);
    let out = "";
    for (let i = 0; i < answer.length; i++) {
      const same = b[i] === a[i];
      out += (same ? '<span>' : '<span class="miss">') + esc(answer[i]) + '</span>';
    }
    return '<span class="diff">' + out + '</span>';
  },

  render() {
    const word = state.round[state.index].word;
    const keys = keypad.wanted();
    document.getElementById("body").innerHTML =
      '<div class="actions" style="margin-top:0">' +
        '<button class="text" id="hear">Réécouter le mot</button>' +
      '</div>' +
      '<form id="spellForm" class="spell">' +
        '<input id="typed" type="text" lang="en" autocomplete="off" autocapitalize="none" ' +
               (keys ? 'inputmode="none" ' : '') +
               'autocorrect="off" spellcheck="false" placeholder="Écris le mot en anglais" ' +
               'aria-label="Écris le mot en anglais">' +
        (keys ? '' : '<button class="text primary" type="submit" id="check">Valider</button>') +
      '</form>' +
      '<p class="verdict" id="verdict"></p>' +
      '<div class="actions">' +
        '<button class="text primary" id="next" hidden></button>' +
        '<button class="text" id="skip">Voir la réponse</button>' +
      '</div>' +
      (keys ? keypad.html("letters", "spellForm") : '');

    const input = document.getElementById("typed");
    if (keys) keypad.wire(input);
    document.getElementById("hear").addEventListener("click", () => speak(spell.correctFor(word)));
    document.getElementById("skip").addEventListener("click", () => spell.settle(false, ""));
    document.getElementById("next").addEventListener("click", goNext);
    document.getElementById("spellForm").addEventListener("submit", event => {
      event.preventDefault();
      const attempt = input.value.trim();
      if (!attempt) return;
      if (state.locked) spell.checkCopy(attempt);
      else if (spell.matches(word, attempt)) spell.settle(true, attempt);
      else spell.settle(false, attempt);
    });

    input.focus();
    // The word is read on arrival: this mode is a dictation.
    speak(spell.correctFor(word));
  },

  settle(success, attempt) {
    if (state.locked) return;
    state.locked = true;
    const word = state.round[state.index].word;
    const answer = spell.correctFor(word);
    const change = recordResult(word, success);
    const verdict = document.getElementById("verdict");
    const input = document.getElementById("typed");

    if (success) {
      verdict.innerHTML = "<b>Sans faute.</b> " + esc(word.fr) + " = " + esc(attempt) + "." +
        synonymNote(word, attempt) + levelNote(change);
      input.disabled = true;
      document.getElementById("check").disabled = true;
      document.getElementById("skip").hidden = true;
      settled(true);
    } else {
      verdict.innerHTML =
        (attempt ? "<b>Pas tout à fait.</b> Tu as écrit " + esc(attempt) + "." : "<b>La réponse :</b>") +
        '<span class="also">Le mot s\'écrit ' + spell.diff(answer, attempt || "") + '.</span>' +
        levelNote(change);
      document.getElementById("skip").hidden = true;
      // Copying it out correctly is what unlocks the next word.
      input.value = "";
      input.placeholder = "Recopie : " + answer;
      input.focus();
      document.getElementById("check").textContent = "Recopier";
      const pass = document.createElement("button");
      pass.className = "text quiet";
      pass.type = "button";
      pass.id = "pass";
      pass.textContent = "passer";
      pass.addEventListener("click", offerNext);
      document.querySelector(".actions").appendChild(pass);
    }
    markTrack(success ? "right" : "wrong");
  },

  checkCopy(attempt) {
    const word = state.round[state.index].word;
    if (spell.matches(word, attempt)) {
      document.getElementById("typed").disabled = true;
      document.getElementById("check").disabled = true;
      const pass = document.getElementById("pass");
      if (pass) pass.remove();
      settled(true);
    } else {
      document.getElementById("typed").value = "";
      document.getElementById("typed").focus();
    }
  },

};

/* ---- Mental arithmetic ----
   The question is written, the answer is typed. A wrong answer shows the
   right one and asks for it to be written out, exactly as a misspelt
   word does: what is corrected by hand is what sticks. */
const maths = {
  // Only the digits matter: spaces and a stray full stop are forgiven.
  matches(word, attempt) {
    const said = String(attempt).replace(/[^0-9-]/g, "");
    return said !== "" && Number(said) === word.answer;
  },

  render() {
    const word = state.round[state.index].word;
    const keys = keypad.wanted();
    document.getElementById("body").innerHTML =
      '<form id="sumForm" class="spell">' +
        '<input id="typed" type="text" ' +
               (keys ? 'inputmode="none" ' : 'inputmode="numeric" pattern="[0-9]*" ') +
               'autocomplete="off" autocorrect="off" spellcheck="false" ' +
               'placeholder="Ta réponse" aria-label="Ta réponse">' +
        (keys ? '' : '<button class="text primary" type="submit" id="check">Valider</button>') +
      '</form>' +
      '<p class="verdict" id="verdict"></p>' +
      '<div class="actions">' +
        '<button class="text primary" id="next" hidden></button>' +
        '<button class="text" id="skip">Voir la réponse</button>' +
      '</div>' +
      (keys ? keypad.html("digits", "sumForm") : '');

    const input = document.getElementById("typed");
    if (keys) keypad.wire(input);
    document.getElementById("skip").addEventListener("click", () => maths.settle(false, ""));
    document.getElementById("next").addEventListener("click", goNext);
    document.getElementById("sumForm").addEventListener("submit", event => {
      event.preventDefault();
      const attempt = input.value.trim();
      if (!attempt) return;
      if (state.locked) maths.checkCopy(attempt);
      else maths.settle(maths.matches(word, attempt), attempt);
    });
    input.focus();
  },

  settle(success, attempt) {
    if (state.locked) return;
    state.locked = true;
    const word = state.round[state.index].word;
    const change = recordResult(word, success);
    const verdict = document.getElementById("verdict");
    const input = document.getElementById("typed");

    if (success) {
      verdict.innerHTML = "<b>C'est juste.</b> " + esc(word.fr) + ", c'est " +
        word.answer + "." + levelNote(change);
      input.disabled = true;
      document.getElementById("check").disabled = true;
      document.getElementById("skip").hidden = true;
      settled(true);
    } else {
      verdict.innerHTML =
        (attempt ? "<b>Pas tout à fait.</b> Tu as écrit " + esc(attempt) + "." : "<b>La réponse :</b>") +
        /* How the answer is found is the exercise's business, not this
           file's: a table of four is not worked out like a double. */
        '<span class="also">' + esc(word.fr) + ", c'est <b>" + word.answer + "</b>" +
        (word.how ? " — " + esc(word.how) : "") + ".</span>" +
        levelNote(change);
      document.getElementById("skip").hidden = true;
      // Writing it out is what unlocks the next one.
      input.value = "";
      input.placeholder = "Recopie : " + word.answer;
      input.focus();
      document.getElementById("check").textContent = "Recopier";
      const pass = document.createElement("button");
      pass.className = "text quiet";
      pass.type = "button";
      pass.id = "pass";
      pass.textContent = "passer";
      pass.addEventListener("click", offerNext);
      document.querySelector(".actions").appendChild(pass);
    }
    markTrack(success ? "right" : "wrong");
  },

  checkCopy(attempt) {
    const word = state.round[state.index].word;
    if (maths.matches(word, attempt)) {
      document.getElementById("typed").disabled = true;
      document.getElementById("check").disabled = true;
      const pass = document.getElementById("pass");
      if (pass) pass.remove();
      settled(true);
    } else {
      document.getElementById("typed").value = "";
      document.getElementById("typed").focus();
    }
  },

};

/* ---- Hear a number, write the figure ----
   The CE2's English: a number is read out, and the answer is the
   figure. Nothing to spell and nothing to pronounce — at that age the
   ear and the hand are enough to be going on with, and a figure is
   something a child of eight can write without hesitating.

   It is the arithmetic above with its question read aloud instead of
   written, so a wrong answer is corrected the same way: the figure is
   shown and copied out before the next one comes. */
const count = {
  matches(word, attempt) { return maths.matches(word, attempt); },

        '<span class="also">' + esc(count.said(word)) + ", c'est <b>" + word.answer +
        "</b> — " + esc(word.fr) + ".</span>" + levelNote(change);
      document.getElementById("skip").hidden = true;
      // Writing it out is what unlocks the next one.
      input.value = "";
      input.placeholder = "Recopie : " + word.answer;
      input.focus();
      document.getElementById("check").textContent = "Recopier";
      const pass = document.createElement("button");
      pass.className = "text quiet";

    } else {

};

const say = {
  render() {
    document.getElementById("body").innerHTML =
      '<div class="mic-row">' +
        '<button class="mic" id="mic" type="button" aria-label="Parler">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
               'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<rect x="9" y="2" width="6" height="12" rx="3"></rect>' +
            '<path d="M5 11a7 7 0 0 0 14 0"></path>' +
            '<line x1="12" y1="18" x2="12" y2="22"></line>' +
          '</svg>' +
        '</button>' +
        '<span class="mic-label" id="micLabel"></span>' +
      '</div>' +
      '<p class="heard" id="heard" aria-live="polite"></p>' +
      '<p class="verdict" id="verdict"></p>' +
      '<div class="actions">' +
        '<button class="text primary" id="next" hidden></button>' +
        '<button class="text" id="model">Écouter le modèle</button>' +
        '<button class="text" id="skip">Donner la réponse</button>' +
      '</div>' +
      '<div class="fallback" id="fallback" hidden>' +
        '<p id="fallbackNote"></p>' +
        '<form id="typeForm">' +
          '<input id="typed" type="text" lang="en" autocomplete="off" autocapitalize="none" ' +
                 'autocorrect="off" spellcheck="false" placeholder="Ta réponse en anglais" ' +
                 'aria-label="Ta réponse en anglais">' +
          '<button class="text" type="submit">Valider</button>' +
        '</form>' +
        '<p id="dictate" hidden>Appuie sur le champ, puis sur le micro de ton clavier et prononce ' +
          'le mot. Pense à mettre le clavier en anglais, sinon il écrira du français.</p>' +
      '</div>' +
      '<p class="notice" id="notice" hidden></p>';

    const mic = document.getElementById("mic");
    mic.disabled = !recognition;
    document.getElementById("micLabel").textContent = recognition
      ? "Appuie et prononce la réponse."
      : "Ce navigateur ne reconnaît pas la parole.";

    mic.addEventListener("click", say.listen);
    document.getElementById("model").addEventListener("click", () => {
      if (listening) recognition.stop();
      speak(state.round[state.index].word.en[0]);
    });
    document.getElementById("skip").addEventListener("click", () => {
      if (listening) recognition.stop();
      say.settle(false);
    });
    document.getElementById("next").addEventListener("click", goNext);
    document.getElementById("typeForm").addEventListener("submit", event => {
      event.preventDefault();
      if (state.locked) return;
      const value = document.getElementById("typed").value.trim();
      if (value) say.judge([value]);
    });

    // The on-screen keyboard has its own dictation button, which works even
    // where the browser microphone is blocked, so phones get it straight away.
    if (!recognition) {
      say.fallback("Ce navigateur ne reconnaît pas la parole. Écris la réponse ici.");
    } else if (matchMedia("(pointer: coarse)").matches) {
      say.fallback("Dicte ou écris la réponse ici.");
    }
  },

  fallback(text) {
    document.getElementById("fallbackNote").textContent = text;
    document.getElementById("fallback").hidden = false;
    if (matchMedia("(pointer: coarse)").matches) {
      document.getElementById("dictate").hidden = false;
    }
  },

  notice(text) {
    const notice = document.getElementById("notice");
    if (!notice) return;
    notice.textContent = text;
    notice.hidden = false;
    say.fallback("Dicte ou écris la réponse ici.");
  },

  async listen() {
    if (!recognition || state.locked) return;
    if (listening) { recognition.stop(); return; }
    if (canSpeak) window.speechSynthesis.cancel();

    const label = document.getElementById("micLabel");
    label.textContent = "Autorisation du micro…";
    const allowed = await ensureMicPermission();
    if (!allowed) { label.textContent = "Micro indisponible."; return; }

    try {
      recognition.start();
    } catch (error) {
      // start() throws if the previous session has not fully ended yet.
      label.textContent = "Attends une seconde, puis réessaie.";
    }
  },

  judge(transcripts) {
    const word = state.round[state.index].word;
    const heard = document.getElementById("heard");
    heard.textContent = "« " + transcripts[0].trim() + " »";
    if (transcripts.some(t => isAccepted(word, t))) {
      say.settle(true);
    } else {
      state.attempts++;
      heard.className = "heard ko";
      document.getElementById("verdict").textContent = state.attempts >= 2
        ? "Toujours pas. Écoute le modèle, puis réessaie."
        : "Ce n'est pas ça. Réessaie.";
    }
  },

  settle(success) {
    state.locked = true;
    const word = state.round[state.index].word;
    const heard = document.getElementById("heard");
    const verdict = document.getElementById("verdict");
    const change = recordResult(word, success);

    if (success) {
      heard.className = "heard ok";
      verdict.innerHTML = "<b>Bien prononcé.</b>" + synonymNote(word, word.en[0]) + levelNote(change);
    } else {
      heard.className = "heard ko";
      verdict.innerHTML = "<b>La réponse était :</b> " + esc(word.en[0]) + "." +
        synonymNote(word, word.en[0]) + levelNote(change);
      speak(word.en[0]);
    }

    markTrack(success ? "right" : "wrong");
    document.getElementById("mic").disabled = true;
    document.getElementById("skip").hidden = true;
    document.getElementById("micLabel").textContent = success ? "Bravo." : "";
    settled(success);
  }
};

if (recognition) {
  recognition.onstart = () => {
    listening = true;
    const mic = document.getElementById("mic");
    if (mic) mic.classList.add("listening");
    const label = document.getElementById("micLabel");
    if (label) label.textContent = "J'écoute…";
    const heard = document.getElementById("heard");
    if (heard) { heard.textContent = ""; heard.className = "heard"; }
  };

  recognition.onresult = event => {
    const result = event.results[event.results.length - 1];
    const transcripts = [];
    for (let i = 0; i < result.length; i++) transcripts.push(result[i].transcript);
    const heard = document.getElementById("heard");
    if (heard) heard.textContent = "« " + transcripts[0].trim() + " »";
    if (result.isFinal) say.judge(transcripts);
  };

  recognition.onerror = event => {
    stopListening();
    const label = document.getElementById("micLabel");
    if (event.error === "not-allowed" || event.error === "service-not-allowed") {
      say.notice(embedded()
        ? "Le micro est bloqué parce que la page est dans un cadre. Ouvre-la dans son propre onglet, ou dicte la réponse ci-dessous."
        : "Le micro est bloqué. Autorise-le dans le navigateur, puis recharge la page.");
    } else if (event.error === "network") {
      say.notice("La reconnaissance vocale a besoin d'une connexion internet.");
    } else if (label) {
      label.textContent = event.error === "no-speech" ? "Je n'ai rien entendu. Réessaie." : "Réessaie.";
    }
  };

  recognition.onend = stopListening;
}

function stopListening() {
  listening = false;
  const mic = document.getElementById("mic");
  if (mic) mic.classList.remove("listening");
  const label = document.getElementById("micLabel");
  if (label && !state.locked && state.asking === "say") label.textContent = "Appuie et prononce la réponse.";
}

// ---- Score ----
function showScore() {
  nowShowing("score");
  const total = state.round.length;
  const comment =
    state.score === total ? "Sans faute." :
    state.score >= total - 2 ? "Presque parfait." :
    state.score >= total / 2 ? "C'est en bonne voie." :
    subject() === "maths" ? "Reprends les calculs tranquillement." :
    "Réécoute les mots et recommence.";

  /* What went wrong in this round. That, and nothing else, is what "to
     work on again" means: a word answered rightly does not belong here,
     however new it still is — and on a first round everything is new, so
     the list used to hold the whole series, right answers and all. */
  const missed = state.round
    .filter(question => question.got === false)
    .map(question => question.word);

  /* An English word leads with the English, which is what is being
     learnt. A sum leads with its question: on its own, an answer says
     nothing about what has to be remembered. */
  const summaryLine = word => {
    const sum = subject() === "maths";
    return '<li>' + esc(sum ? word.fr : word.en[0]) +
      ' <span class="fr">— ' + esc(sum ? word.en[0] : word.fr) + '</span> ' +
      levelDots(recordOf(word).level) + '</li>';
  };

  const missedList = missed.length
    ? '<p class="label" style="margin-top:24px">À retravailler</p>' +
      '<ul class="summary">' + missed.slice(0, 5).map(summaryLine).join("") + '</ul>' +
      (missed.length > 5
        ? '<p class="label">…et ' + (missed.length - 5) + ' ' +
          thing(missed.length - 5) + ' de plus.</p>'
        : '')
    : '<p class="label" style="margin-top:24px">Rien à retravailler dans cette série.</p>';

  const rank = rankOf(progress.points);
  const gained = rank.index > state.rankBefore;
  const paying = state.roundCoins > 0 || gained || state.stampEarned;
  /* What the round was worth, in coins. The figure comes from the town,
     which is the only side that knows its own prices; when it has not
     been heard from, the level reached is still worth announcing. */
  const rankUp = state.roundCoins > 0
    ? '<p class="rank-up"><img src="reward/assets/coin.svg" alt="pièces">+' +
        state.roundCoins + ' pièces</p>' +
      '<p class="label" style="margin:2px 0 0">' +
        (gained ? 'Niveau ' + rank.index + ' atteint. ' : '') +
        'Elles sont dans ta ville.</p>'
    : gained
      ? '<p class="rank-up">Niveau ' + rank.index + '</p>' +
        '<p class="label" style="margin:2px 0 0">Des pièces t\'attendent dans ta ville.</p>'
      : '';

  const goal = goalState();
  const stamp = state.stampEarned
    ? '<div class="row" style="display:flex;align-items:center;gap:16px;margin-top:20px">' +
        stampSvg(goal.stamp, 88) +
        '<span><b>Objectif du jour atteint.</b>' +
        '<span class="done">Un tampon de plus au carnet, et des pièces ' +
          'pour ta ville.</span></span>' +
      '</div>'
    : '';

  screen.innerHTML =
    '<section class="card">' +
      '<p class="score-line">' + state.score + " / " + total + '</p>' +
      '<p>' + comment + ' <b>+' + state.roundPoints + ' points</b></p>' +
      rankUp +
      stamp +
      missedList +
      '<div class="actions">' +
        (paying
          ? '<button class="text primary" id="see-property">Voir ma ville</button>'
          : '') +
        '<button class="text' + (paying ? '' : ' primary') + '" id="again">Recommencer</button>' +
        '<button class="text" id="menu">Changer de liste</button>' +
      '</div>' +
    '</section>';
  if (paying) {
    document.getElementById("see-property").addEventListener("click", openProperty);
  }
  document.getElementById("again").addEventListener("click", () => startRound(state.lesson));
  document.getElementById("menu").addEventListener("click", renderMenu);
  const first = document.getElementById("see-property") || document.getElementById("again");
  if (first) first.focus();
}

// Keys 1 to 4 answer in both multiple-choice modes — and nowhere the
// pupil writes their answer, where a digit is part of the answer itself.
document.addEventListener("keydown", event => {
  if (state.asking === "say" || state.asking === "spell" || state.asking === "maths") return;
  if (event.key >= "1" && event.key <= "4") {
    const options = document.getElementById("options");
    const button = options && options.children[Number(event.key) - 1];
    if (button) button.click();
  }
});

/* Builds a believable state at a given rank: the points that rank needs,
   word levels spread the way they would be after that much practice, and
   a run of past days in the stamp book. The property is left alone — a
   made-up rank must not buy real land. */
function demoProgress(rank) {
  const fake = emptyProgress();
  fake.points = RANKS.THRESHOLDS[rank - 1] + 10;

  // The further along, the more words have been carried up to the top.
  const share = Math.min(0.9, rank / 60);
  allWords().forEach(word => {
    const level = Math.random() < share
      ? MAX_LEVEL - Math.floor(Math.random() * 2)
      : Math.floor(Math.random() * 4);
    const seen = level + 1 + Math.floor(Math.random() * 6);
    fake.words[word.key] = {
      level,
      seen,
      ok: Math.max(level, seen - 1 - Math.floor(Math.random() * 3)),
      last: Date.now() - Math.floor(Math.random() * 12) * 86400000
    };
  });

  // One stamped day per two ranks, running back from today.
  const days = Math.min(60, Math.ceil(rank / 2));
  for (let back = 0; back < days; back++) {
    const date = new Date();
    date.setDate(date.getDate() - back);
    fake.days[dayKey(date)] = { n: 20, goal: 20, stamp: stampFor(dayKey(date)), p: 60 };
  }
  fake.today = { date: dayKey(), keys: [] };
  fake.days[dayKey()].n = 0;
  fake.days[dayKey()].stamp = null;
  return fake;
}

// Start-up: the word list comes first, then the saved progress, then the
// menu. Both loads are awaited so that a network-backed Store or a remote
// word list would behave the same way.
(async function init() {
  try {
    LESSONS = loadLessons();
  } catch (error) {
    screen.innerHTML =
      '<section class="card">' +
        '<p><b>La liste de mots n\'a pas pu être chargée.</b></p>' +
        '<p class="label">Vérifie que le fichier <b>words.js</b> se trouve bien à côté de ' +
          'index.html, et qu\'il ne contient pas d\'erreur de syntaxe : une virgule oubliée ' +
          'ou une accolade en trop suffit. Le détail exact apparaît dans la console du navigateur.</p>' +
        '<p class="label">Détail technique : ' + esc(String(error && error.message)) + '</p>' +
      '</section>';
    return;
  }
  keyLessons();

  /* The way out lives above the screens rather than in one of them, so
     it is hung once and never again. Where it leads depends on where
     the pupil is: out of an exercise first, out of the profile after. */
  document.getElementById("wayout").addEventListener("click", renderMenu);

  /* Who is holding the telephone comes before anything else: the
     progress, the property and the daily goal all belong to a profile,
     and none of them is read until one is chosen. The one who
     practised last is offered first, but never taken for granted — a
     brother picking up his sister's telephone should not find himself
     answering in her place.

     Unless the page was opened from a link in an email from the family
     account: then it is the account screen that has something to say. */
  const came = CLOUD.start();
  if (came && came.type === "recovery") renderAccount({ recovery: true });
  else if (came && came.type === "error") renderAccount({ trouble: came.message });
  else if (came && came.type === "signup") {
    renderAccount({ fine: "L'adresse est confirmée : le compte famille est prêt." });
  } else renderProfiles();
})();
</script>
