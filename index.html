<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révisions</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Shantell+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ---- Design tokens: a French school exercise book (papier Seyès) ---- */
  :root {
    --paper: #FBFAF6;
    --grid-fine: rgba(122, 142, 196, 0.28);
    --grid-strong: rgba(96, 118, 180, 0.42);
    --margin-red: #D8443F;
    --ink: #1C2B63;
    --ink-soft: #5B6890;
    --card: #FFFFFF;
    --card-edge: rgba(28, 43, 99, 0.16);
    --right: #1F7A4D;
    --right-bg: rgba(31, 122, 77, 0.10);
    --wrong: #C0392B;
    --wrong-bg: rgba(192, 57, 43, 0.09);
    --focus: #1C2B63;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #101725;
      --grid-fine: rgba(140, 165, 220, 0.13);
      --grid-strong: rgba(150, 175, 230, 0.20);
      --margin-red: #E86F63;
      --ink: #EAEFFA;
      --ink-soft: #9DA9C6;
      --card: #18202F;
      --card-edge: rgba(190, 205, 240, 0.20);
      --right: #5FD39B;
      --right-bg: rgba(95, 211, 155, 0.14);
      --wrong: #FF8A7A;
      --wrong-bg: rgba(255, 138, 122, 0.13);
      --focus: #EAEFFA;
    }
  }
  :root[data-theme="dark"] {
    --paper: #101725;
    --grid-fine: rgba(140, 165, 220, 0.13);
    --grid-strong: rgba(150, 175, 230, 0.20);
    --margin-red: #E86F63;
    --ink: #EAEFFA;
    --ink-soft: #9DA9C6;
    --card: #18202F;
    --card-edge: rgba(190, 205, 240, 0.20);
    --right: #5FD39B;
    --right-bg: rgba(95, 211, 155, 0.14);
    --wrong: #FF8A7A;
    --wrong-bg: rgba(255, 138, 122, 0.13);
    --focus: #EAEFFA;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--paper);
    background-image:
      repeating-linear-gradient(to right, var(--grid-fine) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(to bottom, var(--grid-fine) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(to bottom, var(--grid-strong) 0 1px, transparent 1px 96px);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    padding: 26px 16px 56px;
    display: flex;
    justify-content: center;
  }

  .sheet { width: 100%; max-width: 560px; }

  /* The face, the name and the school year on one line, each centred on
     the others rather than sat on a shared baseline: a round face and a
     capital letter do not have the same middle. */
  h1 {
    font-family: "Shantell Sans", "Comic Sans MS", cursive;
    font-weight: 700;
    font-size: 2rem;
    color: var(--margin-red);
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  h1 .face { width: 44px; height: 44px; margin: 0; }
  /* The name and the face are what one presses to hand the telephone
     over, so they are a button — and look like the title all the same. */
  h1 .who {
    display: flex;
    align-items: center;
    gap: 10px;
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    padding: 2px 6px;
    margin-left: -6px;
    border-radius: 10px;
    text-align: left;
  }
  h1 .who:hover { background: rgba(0, 0, 0, 0.05); }
  h1 .who:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }

  /* The way out sits at the right of the title, the same button in the
     same place whatever the screen is showing. */
  .topline {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 14px;
    margin-bottom: 20px;
  }
  .topline h1 { flex: 1 1 auto; }
  .topline #wayout { margin-left: auto; }

  /* ---- An exercise, on the whole page ----
     While a question is asked, nothing else is: the name and the card
     around the question go, and only the way out stays. The page is as
     tall as the screen, so the on-screen keyboard can sit at the bottom,
     under the thumbs, where a phone's own keyboard would be. */
  body.in-round {
    min-height: 100vh;
    min-height: 100dvh;
    padding-top: 14px;
    padding-bottom: 10px;
    /* The card is gone but not its paper: a plain page, no grid showing
       through the question or between the keys. */
    background: var(--card);
  }
  body.in-round .sheet { display: flex; flex-direction: column; }
  body.in-round .topline { margin-bottom: 8px; }
  body.in-round .topline h1 { display: none; }
  body.in-round #screen { flex: 1; display: flex; flex-direction: column; }
  body.in-round #screen > .card {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: none;
    border: none;
    border-radius: 0;
    padding: 0;
  }
  body.in-round #body { flex: 1; display: flex; flex-direction: column; }
  body.in-round .keypad { margin-top: auto; padding-top: 22px; }

  .card {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-left: 5px solid var(--margin-red);
    border-radius: 6px;
    padding: 24px 20px;
  }

  .label { color: var(--ink-soft); font-size: 0.9rem; margin: 0 0 10px; }
  .label + .label, .stack + .label { margin-top: 24px; }

  .stack { display: grid; gap: 10px; }

  /* ---- Buttons ---- */
  button { font: inherit; cursor: pointer; }

  .choice {
    display: block;
    width: 100%;
    text-align: left;
    color: var(--ink);
    background: transparent;
    border: 1.5px solid var(--card-edge);
    border-radius: 5px;
    padding: 13px 15px;
  }
  .choice:hover { border-color: var(--ink); }
  .choice:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .choice .sub { display: block; color: var(--ink-soft); font-size: 0.85rem; }
  .choice[aria-pressed="true"] { border-color: var(--ink); background: var(--right-bg); }

  /* ---- The face a profile wears ----
     A child who cannot yet read a list of names finds their own line by
     its drawing, so it comes first and it is large. The grid of them is
     sized in whole columns, which keeps it tidy at any width. */
  .face {
    width: 40px; height: 40px;
    vertical-align: middle;
    margin-right: 10px;
    flex: none;
  }
  .face.small { width: 24px; height: 24px; margin-right: 6px; }

  .choice.is-who { display: flex; align-items: center; }
  .choice.is-who .who-name { flex: 1; }

  /* The question that follows the grid needs the same air as one that
     follows a stack of choices. */
  .faces + .label { margin-top: 24px; }

  .faces {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(58px, 1fr));
    gap: 8px;
  }
  .face-pick {
    display: grid;
    place-items: center;
    padding: 6px;
    border: 1.5px solid var(--card-edge);
    border-radius: 8px;
    background: transparent;
    /* No waiting to see whether a tap was the first of two. */
    touch-action: manipulation;
  }
  .face-pick img { width: 42px; height: 42px; display: block; }
  .face-pick:hover { border-color: var(--ink); }
  .face-pick:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .face-pick[aria-pressed="true"] { border-color: var(--ink); border-width: 3px; background: var(--right-bg); }

  /* The school year, beside a name: small, quiet, and enough to tell
     two children apart at a glance. */
  .grade {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 9px;
    border-radius: 999px;
    border: 1.5px solid var(--card-edge);
    color: var(--ink-soft);
    font-size: 0.78rem;
    font-weight: 700;
    vertical-align: middle;
  }
  .choice .grade { float: right; margin-left: 0; }

  .bar { display: block; height: 6px; border-radius: 3px; background: var(--card-edge); margin-top: 10px; }
  .bar span { display: block; height: 100%; border-radius: 3px; background: var(--right); }
  .done { display: block; color: var(--ink-soft); font-size: 0.85rem; margin-top: 6px; }

  /* ---- Daily goal and stamps ---- */
  .goal { border-left-color: var(--ink); }
  .goal .count { font-family: "Shantell Sans", "Comic Sans MS", cursive; font-size: 1.7rem; margin: 0; }
  .goal .bar { height: 8px; margin-top: 12px; }
  .goal .row { display: flex; align-items: center; gap: 16px; }
  .goal .row .col { flex: 1; }

  .stamp { color: var(--margin-red); flex: none; }

  .rank { border-left-color: var(--margin-red); }
  .rank-up {
    font-family: "Shantell Sans", "Comic Sans MS", cursive;
    font-size: 1.3rem;
    color: var(--margin-red);
    margin: 14px 0 0;
  }
  .rank-up img { width: 1.1em; height: 1.1em; vertical-align: -0.15em; margin-right: 5px; }
  .also.gain { color: var(--right); }

  /* ---- The property ----
     The reward module takes the whole screen while it is open; the
     sheet underneath stops scrolling so the two never fight. */
  .property { position: fixed; inset: 0; z-index: 100; background: #0f1b12; }
  .property iframe { display: block; width: 100%; height: 100%; border: 0; }
  body.is-away { overflow: hidden; }
  .purse { font-weight: 700; }
  .purse img { width: 1.1em; height: 1.1em; vertical-align: -0.15em; margin-right: 4px; }  .stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 16px; margin-top: 18px; }
  .stamps figure { margin: 0; text-align: center; }
  .stamps figcaption { font-size: 0.75rem; color: var(--ink-soft); margin-top: 2px; }

  .modes { display: grid; gap: 10px; }

  .text {
    border-radius: 5px;
    padding: 11px 18px;
    border: 1.5px solid var(--card-edge);
    background: transparent;
    color: var(--ink);
  }
  .text:hover { border-color: var(--ink); }
  .text:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .text.primary { font-weight: 700; background: var(--ink); border-color: var(--ink); color: var(--paper); }
  [hidden] { display: none !important; }

  /* What is not the main thing to do on a screen is still a button, and
     looks like one: there is nothing underlined left to press. */
  .text.quiet { padding: 8px 14px; font-size: 0.92rem; color: var(--ink-soft); }
  .text.quiet:hover { color: var(--ink); }

  /* ---- Quiz shell ---- */
  .topbar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .topbar .counter { color: var(--ink-soft); font-size: 0.9rem; }

  .track { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 18px; }
  .tick { width: 18px; height: 18px; border: 1px solid var(--card-edge); border-radius: 3px; }
  .tick.right { background: var(--right); border-color: var(--right); }
  .tick.wrong { background: var(--wrong); border-color: var(--wrong); }
  .tick.now { border-color: var(--ink); border-width: 2px; }

  .prompt {
    font-family: "Shantell Sans", "Comic Sans MS", cursive;
    font-size: clamp(1.8rem, 6.5vw, 2.5rem);
    font-weight: 600;
    line-height: 1.2;
    margin: 0 0 22px;
  }

  .option { display: flex; align-items: center; gap: 12px; }
  .option .key { font-size: 0.8rem; color: var(--ink-soft); min-width: 1.1em; }
  .option.picked-right { border-color: var(--right); background: var(--right-bg); }
  .option.picked-wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .option.reveal { border-color: var(--right); border-style: dashed; }
  .option.speaking .word { text-decoration: underline; text-underline-offset: 4px; }

  .verdict { margin: 18px 0 0; min-height: 1.5em; }
  .verdict .also { color: var(--ink-soft); font-size: 0.95rem; display: block; }

  .level { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 6px; }
  .level .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--card-edge); }
  .level .dot.on { background: var(--right); border-color: var(--right); }

  .summary { margin: 18px 0 0; }
  .summary li { margin-bottom: 4px; }
  .summary .fr { color: var(--ink-soft); }

  .report { list-style: none; padding: 0; margin: 14px 0 0; }
  .report li {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--card-edge);
  }
  .report li:last-child { border-bottom: none; }
  .report .en { font-weight: 700; }
  .report .fr, .report .meta { display: block; color: var(--ink-soft); font-size: 0.85rem; }
  .report .dots { flex: none; padding-top: 4px; }
  /* A child's own report is a list to run an eye down: no rules between
     the lines, and closer together, so the page is read in one look. */
  .report.plain li { border-bottom: none; padding: 4px 0; align-items: center; }
  .report.plain .dots { padding-top: 0; }
  .card + .card { margin-top: 14px; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

  /* ---- Speaking mode ---- */
  .mic-row { display: flex; align-items: center; gap: 14px; }
  .mic {
    width: 74px; height: 74px; flex: none;
    border-radius: 50%;
    border: 2px solid var(--ink);
    background: transparent;
    color: var(--ink);
    display: grid;
    place-items: center;
  }
  .mic svg { width: 28px; height: 28px; }
  .mic:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .mic[disabled] { opacity: .4; cursor: default; }
  .mic.listening { background: var(--wrong); border-color: var(--wrong); color: #fff; }
  @media (prefers-reduced-motion: no-preference) {
    .mic.listening { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--wrong-bg); }
      50% { box-shadow: 0 0 0 12px var(--wrong-bg); }
    }
  }
  .mic-label { color: var(--ink-soft); }

  .heard {
    font-family: "Shantell Sans", "Comic Sans MS", cursive;
    font-size: 1.4rem;
    margin: 20px 0 0;
    min-height: 1.6em;
    word-break: break-word;
  }
  .heard.ok { color: var(--right); }
  .heard.ko { color: var(--wrong); }

  .fallback { margin-top: 20px; border-top: 1px solid var(--card-edge); padding-top: 16px; }
  .fallback p { margin: 0 0 10px; color: var(--ink-soft); font-size: 0.95rem; }
  .fallback form { display: flex; gap: 8px; }
  .fallback input {
    flex: 1; font: inherit; color: var(--ink);
    background: transparent;
    border: 1.5px solid var(--card-edge);
    border-radius: 5px;
    padding: 11px 13px;
  }
  .fallback input:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }

  .notice { margin-top: 14px; font-size: 0.9rem; color: var(--wrong); }
  .notice.fine { color: var(--right); }
  /* A row of buttons that may not fit on one line: it wraps with room. */
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 0; }
  .actions.after { margin-top: 14px; }

  /* ---- Dictation ---- */
  .spell { display: flex; gap: 8px; margin-top: 4px; }
  .spell input {
    flex: 1;
    font-family: "Shantell Sans", "Comic Sans MS", cursive;
    font-size: 1.3rem;
    color: var(--ink);
    background: transparent;
    border: 1.5px solid var(--card-edge);
    border-radius: 5px;
    padding: 10px 13px;
    min-width: 0;
  }
  .spell input:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
  .spell input:disabled { opacity: 0.7; }
  /* ---- The on-screen keyboard ----
     Twenty narrow columns, so that a row of nine letters can sit half a
     key in from a row of ten, as on any keyboard. */
  .keypad {
    display: grid;
    grid-template-columns: repeat(20, 1fr);
    gap: 8px 4px;
    /* The full width of the screen, whatever the page around it: every
       pixel is a wider key and one fewer letter typed beside. */
    width: calc(100vw - 8px);
    margin: 22px 0 0 calc(50% - 50vw + 4px);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  /* Ten figures need less room than twenty-six letters: on a tablet
     they stop at a width a hand still spans. */
  .keypad.digits {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    width: min(calc(100vw - 8px), 560px);
    margin-left: calc(50% - min(calc(50vw - 4px), 280px));
  }
  .pad-key {
    min-width: 0;
    height: 50px;
    padding: 0;
    font: inherit;
    font-size: 1.25rem;
    color: var(--ink);
    background: var(--card);
    border: 1.5px solid var(--card-edge);
    border-radius: 6px;
    display: grid;
    place-items: center;
    /* No waiting to see whether a tap was the first of two. */
    touch-action: manipulation;
  }
  .keypad.digits .pad-key { height: 56px; font-size: 1.5rem; }
  .pad-key:active { background: var(--card-edge); }
  .pad-key svg { width: 24px; height: 24px; }
  .pad-key.small { font-size: 0.9rem; color: var(--ink-soft); }
  .keypad .pad-key.go { font-size: 1rem; font-weight: 700; background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .pad-key:disabled, #body:has(#typed:disabled) .pad-key { opacity: 0.45; }
  .diff {
    font-family: "Shantell Sans", "Comic Sans MS", cursive;
    font-size: 1.2rem;
    letter-spacing: 0.04em;
  }
  .diff .miss { color: var(--wrong); text-decoration: underline; text-underline-offset: 3px; }

  .score-line {
    font-family: "Shantell Sans", "Comic Sans MS", cursive;
    font-size: 2.4rem;
    margin: 0 0 8px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .choice, .text { transition: border-color .15s, background-color .15s; }
  }
</style>
</head>
<body>
<script src="words.js"></script>
<script src="ranks.js"></script>
<script src="cloud.js"></script>
<script src="profiles.js"></script>
<script src="maths.js"></script>

<main class="sheet">
  <!-- Who is holding the telephone, said once and only here. -->
  <div class="topline">
    <h1 id="heading">Profils</h1>
    <button class="text quiet" id="wayout" hidden></button>
  </div>
  <div id="screen"></div>
</main>

<!-- The reward module, a page of its own under reward/. It is only
     loaded the first time the pupil opens it, and covers the sheet
     whole while it is there. -->
<div id="property" class="property" hidden></div>

<script>
/* =====================================================================
   VOCABULARY — the words live in words.js, loaded just before this
   script. That file grows all year; this one rarely changes.
   See the header of words.js for how to add a word or a list.
   ===================================================================== */
let LESSONS = [];

function loadLessons() {
  // words.js declares VOCABULARY. A bare array is accepted too, in case
  // the file gets simplified one day.
  if (typeof VOCABULARY === "undefined") throw new Error("words.js n'est pas chargé");
  const lessons = Array.isArray(VOCABULARY) ? VOCABULARY : VOCABULARY.lessons;
  if (!Array.isArray(lessons) || !lessons.length) throw new Error("aucune liste dans words.js");
  return lessons;
}

// Longest round allowed. Beyond this the words are drawn at random,
// so "tous les mots" stays a reasonable length as the lists grow.
const ROUND_LENGTH = 15;

// ---- Helpers ----
const screen = document.getElementById("screen");
const headingEl = document.getElementById("heading");

function shuffle(list) {
  const copy = list.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function esc(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

/* Strips accents, punctuation and doubled spaces before comparing answers.
   Apostrophes are removed rather than turned into spaces, so a transcription
   like "dont run" still matches "don't run".

   Figures are kept: a recogniser asked for "seventeen" hands back "17",
   and the numbers list says so in its `heard`. Nothing else in the
   lists is written with a figure, so nothing else changes. */
function normalise(text) {
  return text
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/['\u2019\u02bc]/g, "")
    .replace(/[^a-z0-9 ]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function isAccepted(word, attempt) {
  const said = normalise(attempt);
  if (!said) return false;
  const targets = [...word.en, ...(word.heard || [])].map(normalise);
  return targets.some(t => said === t || said.includes(" " + t) || said.startsWith(t + " "));
}

/* =====================================================================
   PROGRESS STORAGE — the only place that knows where the data lives.

   The whole app goes through Store.load / Store.save / Store.merge and
   through the helpers below. The save stays on the telephone; when a
   family account is signed in, cloud.js keeps a copy of it on the
   server, and uses Store.merge when two devices have both moved on.

   Stored shape:
     {
       version: 3,
       points: 412,
       words: { "lessonId:Mot francais": { level, seen, ok, last } },
       days:  { "2026-09-10": { n: 12, goal: 15, stamp: 3, p: 54 } },
       today: { date: "2026-09-10", keys: ["greetings:Salut"] },
       reward: { coins: 1560, level: 8, stamps: 34 }
     }

   The reward — the property, its coins and everything put down on it —
   is not in here: the module under reward/ keeps its own save. What is
   kept above is only the last purse it reported, so the menu can show it
   without opening it.
   ===================================================================== */
/* Whose progress is being read and written. The app opens on the
   profile screen and nothing is loaded until one is chosen, so this is
   never null once the exercises are on screen. */
let PROFILE = null;

const STORE_PLAIN = "anglais-progress-v1";
function storeKey() {
  return PROFILES.keyFor(STORE_PLAIN, PROFILE && PROFILE.id);
}
const MAX_LEVEL = 5;

/* Demonstration mode: index.html?demo=40 shows what the app looks like at
   rank 40, stamps and all, without touching what the pupil has really done.
   Nothing is written to storage while it is on. */
const DEMO_RANK = Math.max(0, Math.min(RANKS.COUNT,
  Number(new URLSearchParams(location.search).get("demo")) || 0));

// Days to wait before a word falls due again, by level. A word just learnt
// comes back tomorrow, a mastered one every fortnight: nothing is ever
// dropped for good.
const INTERVALS = [0, 1, 2, 4, 8, 15];

// The daily goal follows the words that fall due, but never asks for fewer
// than the floor, so that a quiet day is still a real session, nor more than
// the ceiling, so that a week away does not come back as an unbearable pile.
const GOAL_FLOOR = 10;
const GOAL_CEILING = 20;

function dayKey(date) {
  const day = date || new Date();
  return day.getFullYear() + "-" +
    String(day.getMonth() + 1).padStart(2, "0") + "-" +
    String(day.getDate()).padStart(2, "0");
}

function emptyProgress() {
  /* `reward` is only a copy of what the reward module reports, kept so
     the menu can show the purse without opening it. The property itself
     — coins, land, everything put down — is saved by the module. */
  return { version: 3, points: 0, words: {}, days: {}, today: { date: dayKey(), keys: [] },
           reward: { coins: 0, level: 0, stamps: 0 } };
}

const Store = {
  async load() {
    try {
      const raw = localStorage.getItem(storeKey());
      return Store.adopt(raw ? JSON.parse(raw) : null);
    } catch (error) {
      return emptyProgress();
    }
  },

  async save(data) {
    if (DEMO_RANK) return false;
    try {
      localStorage.setItem(storeKey(), JSON.stringify(data));
      CLOUD.touched(storeKey());
      return true;
    } catch (error) {
      return false;
    }
  },

  /* Accepts anything previously stored, including the version 1 shape
     which only had `words`, and starts a fresh tally when the date has
     turned. A save is never thrown away because the app has moved on:
     whatever is recognised is kept, the rest is left behind. */
  adopt(data) {
    const fresh = emptyProgress();
    if (!data) return fresh;
    fresh.points = data.points || 0;
    fresh.words = data.words || {};
    fresh.days = data.days || {};
    if (data.reward) {
      fresh.reward.coins = data.reward.coins || 0;
      fresh.reward.level = data.reward.level || 0;
      fresh.reward.stamps = data.reward.stamps || 0;
    }
    if (data.today && data.today.date === dayKey()) fresh.today = data.today;
    return fresh;
  },

  // Needed the day the same pupil practises on two devices: for each word
  // the most recent record wins, and for each day the fuller tally wins.
  merge(local, remote) {
    const merged = Store.adopt(local);
    for (const [key, record] of Object.entries((remote && remote.words) || {})) {
      const mine = merged.words[key];
      if (!mine || (record.last || 0) > (mine.last || 0)) merged.words[key] = record;
    }
    for (const [key, day] of Object.entries((remote && remote.days) || {})) {
      const mine = merged.days[key];
      if (!mine || (day.n || 0) > (mine.n || 0)) merged.days[key] = day;
    }
    // The total is rebuilt from the days rather than added up, so that
    // syncing twice cannot inflate it. Days saved before they kept their
    // points count for nothing there, so the total never falls below
    // what either side already had.
    merged.points = Math.max(
      Object.values(merged.days).reduce((sum, day) => sum + (day.p || 0), 0),
      (local && local.points) || 0,
      (remote && remote.points) || 0);
    const theirs = (remote && remote.reward) || {};
    merged.reward.coins = Math.max(merged.reward.coins, theirs.coins || 0);
    merged.reward.level = Math.max(merged.reward.level, theirs.level || 0);
    merged.reward.stamps = Math.max(merged.reward.stamps, theirs.stamps || 0);
    return merged;
  }
};

let progress = emptyProgress();

/* What travels to the family account besides the list of profiles:
   each profile's progress, merged word by word when two devices have
   both moved on, and its property, which cannot be merged and goes to
   whichever was written last. */
CLOUD.track(key => key.indexOf(STORE_PLAIN + ":") === 0,
  (local, remote) => Store.merge(local, remote));
CLOUD.track(key => key.indexOf("reward-property-v1:") === 0);

// Every word gets a stable key. Renaming the French side of a word starts
// its progress over, which is the intended behaviour: it is a new word.
function keyLessons() {
  LESSONS.forEach(lesson => {
    lesson.words.forEach(word => {
      word.key = lesson.id + ":" + word.fr;
      /* A list that names the modes it is asked in hands them to each of
         its words, so that a question carries its own way of being
         asked wherever it turns up — in its list, or in the middle of
         the day's revision. */
      if (lesson.ask) word.ask = lesson.ask;
      // Likewise a list whose answers come in forms, for its wrong choices.
      if (lesson.forms) word.forms = true;
    });
  });
}

/* ---- What this pupil is working on ----

   The school year decides the subject: English for the sixième, maths
   for the CE2. Everything around an exercise — the ranks, the points,
   the daily goal, the spaced repetition, the property — knows nothing
   of what is being revised and serves either without a change.

   Both subjects hand back lists of the same shape: an id, a title, and
   `items` to practise. The one place below that has to be asked which
   subject it is, is the menu, because a list of words and a page of
   sums do not offer the same things to do. */

function subjectOf(grade) {
  return grade === "ce2" ? "maths" : "english";
}

function subject() {
  return PROFILE ? subjectOf(PROFILE.grade) : "english";
}

/* Whether the one holding the telephone is here to work or to look over
   the work of others. A parent has no exercises, no daily goal and no
   town — only the children's books. */
function isParent() {
  return !!PROFILE && PROFILES.grown(PROFILE.grade);
}

/* The lists a subject offers, each saying what it is made of: `of` is
   "sums" or "words", because a page of sums and a list of words are not
   counted, reported or asked in the same way. The CE2 works on sums and
   on one list of English words; the sixième on words alone. */
function wordList(lesson) {
  return {
    id: lesson.id,
    title: lesson.title,
    subtitle: lesson.subtitle,
    items: lesson.words,
    noun: lesson.noun,
    of: "words"
  };
}

function listsFor(which) {
  const mine = LESSONS.filter(lesson =>
    which === "maths" ? lesson.grade === "ce2" : lesson.grade !== "ce2");
  if (which !== "maths") return mine.map(wordList);
  return MATHS.EXERCISES.map(one => Object.assign({ of: "sums" }, one))
    .concat(mine.map(wordList));
}

function lists() { return listsFor(subject()); }

/* What one of them is called, for a sentence that counts them. The
   English lists are made of words; a page of sums is not. And where a
   pupil has both — the CE2, who learns their tables and their English
   numbers — neither word is true of the whole, so they are questions. */
function thing(many) {
  if (subject() !== "maths") return many > 1 ? "mots" : "mot";
  const kinds = listsFor("maths").map(list => list.of);
  if (kinds.indexOf("words") !== -1) return many > 1 ? "questions" : "question";
  return many > 1 ? "calculs" : "calcul";
}

/* What one list's items are called, which is not always the subject's
   word: a CE2 works on calculs, but their list of English numbers is
   made of mots and the menu should say so. */
function nounOf(list, many) {
  const said = list && list.noun;
  if (said) return many > 1 ? said.many : said.one;
  if (list && list.of) return list.of === "sums"
    ? (many > 1 ? "calculs" : "calcul")
    : (many > 1 ? "mots" : "mot");
  return thing(many);
}

/* And what the whole set of them is called, when they are offered
   shuffled together. The two do not even agree in gender, so the phrase
   is said here rather than pieced together at the other end. */
function allMixed(many) {
  return subject() === "maths"
    ? "Les " + many + " exercices mélangés"
    : "Les " + many + " listes mélangées";
}

// The mode a subject is practised in. Maths has one for now, so it is
// never chosen — it is simply what the CE2 does.
function modesFor() {
  return subject() === "maths" ? ["maths"] : ["mcq", "mcqfr", "spell", "say"];
}

/* A mode belongs to a subject. Changing profile can therefore leave the
   app holding one that means nothing here — a dictation for a CE2 — so
   it falls back to the first the subject offers. */
function settleMode() {
  const offered = modesFor();
  if (offered.indexOf(state.mode) === -1) state.mode = offered[0];
}

function recordOf(word) {
  return progress.words[word.key] || { level: 0, seen: 0, ok: 0, last: 0 };
}

// Everything this pupil practises, whatever the subject.
function allWords() {
  return lists().flatMap(one => one.items);
}

// ---- Spaced repetition ----
// Milliseconds until the word falls due again; negative once it is overdue.
function dueIn(word) {
  const record = recordOf(word);
  if (!record.last) return -Infinity;
  return record.last + INTERVALS[record.level] * 86400000 - Date.now();
}

function isDue(word) { return dueIn(word) <= 0; }

function dueWords(pool) {
  return pool.filter(isDue).sort((a, b) => dueIn(a) - dueIn(b));
}

// ---- The day's goal ----
function computeGoal() {
  const words = allWords();
  const due = dueWords(words).length;
  return Math.max(Math.min(GOAL_FLOOR, words.length), Math.min(due, GOAL_CEILING));
}

function today() {
  const key = dayKey();
  if (progress.today.date !== key) progress.today = { date: key, keys: [] };
  if (!progress.days[key]) progress.days[key] = { n: 0, goal: computeGoal(), stamp: null };
  return progress.days[key];
}

// A word counts once a day, whether it was right or wrong: the goal rewards
// the effort, so that no one avoids the hard words or the speaking mode.
function noteReview(word) {
  const day = today();
  const first = !progress.today.keys.includes(word.key);
  if (first) {
    progress.today.keys.push(word.key);
    day.n = progress.today.keys.length;
  }
  const completed = first && day.stamp === null && day.n >= day.goal;
  if (completed) day.stamp = stampFor(dayKey());
  return { first, completed };
}

/* ---- Points and ranks ----
   Points reward the effort first: a word counts simply for having been
   attempted. The full amount is given once per word per day, so replaying
   the same short list cannot inflate the total, while a second round still
   brings a little. The speaking mode pays more because it is the hardest
   and the one most likely to be avoided. */
const POINTS = { word: 2, correct: 1, speaking: 1, goal: 20, again: 1 };

// The ladder of ranks lives in ranks.js; what a rank is worth lives in
// the reward module. Neither has anything to do with learning English.
function rankOf(points) {
  return RANKS.of(points || 0);
}

function addPoints(amount) {
  progress.points = (progress.points || 0) + amount;
  const day = today();
  day.p = (day.p || 0) + amount;
  // The property pays the new ranks the moment it hears of them.
  syncProperty();
}

/* ---- The property ----
   The reward module is a page of its own, shown full screen in a frame.
   The app tells it two things — the rank reached and the number of days
   stamped — and it answers with the purse, which the menu shows between
   two rounds. A rank pays for the climb, a stamp for coming back: both
   are settled on its side and never twice, so sending the same figures
   again costs nothing.

   Nothing is sent while the demonstration mode is on: a made-up rank
   must not buy a real property. */
let propertyFrame = null;

/* The frame itself, made once. The town is what knows its own prices,
   so nothing is really counted until it has been told what was earned;
   it is therefore loaded out of sight as soon as there is something to
   settle, rather than waiting for a visit. A frame in a hidden panel
   loads all the same, and answers with the purse. */
function wakeProperty() {
  if (propertyFrame) return propertyFrame;
  propertyFrame = document.createElement("iframe");
  propertyFrame.title = "Ma ville";
  propertyFrame.addEventListener("load", syncProperty);
  /* The property belongs to the profile, so the module is told which
     one it is opening: it keeps its save under a key of its own. */
  propertyFrame.src = "reward/index.html" +
    (PROFILE ? "?p=" + encodeURIComponent(PROFILE.id) : "");
  document.getElementById("property").appendChild(propertyFrame);
  return propertyFrame;
}

function openProperty() {
  const panel = document.getElementById("property");
  const woken = !!propertyFrame;
  panel.hidden = false;
  document.body.classList.add("is-away");
  trapBack();
  wakeProperty();
  if (woken) syncProperty();
}

/* Throws the property away without opening it, so the next child to
   ask for it gets their own rather than the one before's. */
function dropProperty() {
  const panel = document.getElementById("property");
  panel.hidden = true;
  panel.innerHTML = "";
  propertyFrame = null;
  document.body.classList.remove("is-away");
}

/* The property came down from the family account: a town already loaded
   holds the old one. Out of sight it is simply thrown away; on screen it
   is opened again, on the new one. */
function reloadProperty() {
  if (!propertyFrame) return;
  if (document.getElementById("property").hidden) { dropProperty(); return; }
  propertyFrame.src = "reward/index.html?p=" + encodeURIComponent(PROFILE.id);
}

function closeProperty() {
  document.getElementById("property").hidden = true;
  document.body.classList.remove("is-away");
  renderMenu();
}

function syncProperty() {
  if (DEMO_RANK) return;
  // Not loaded yet: waking it syncs on its own, once it is there.
  if (!propertyFrame) { wakeProperty(); return; }
  if (!propertyFrame.contentWindow) return;
  const to = propertyFrame.contentWindow;
  to.postMessage({ type: "reward:level", level: rankOf(progress.points).index }, "*");
  to.postMessage({ type: "reward:stamps", stamps: earnedStamps().length }, "*");
}

window.addEventListener("message", event => {
  const message = event.data;
  if (!message || typeof message !== "object") return;
  if (message.type === "reward:back") { closeProperty(); return; }
  if (message.type !== "reward:state") return;
  progress.reward = {
    coins: message.coins || 0,
    level: message.level || 0,
    stamps: message.stamps || 0
  };
  /* What the town has just handed over. Added up while a round is on,
     so the score page can say what the round was worth without this
     side knowing a single one of the town's prices. */
  if (message.paid && showing === "round") state.roundCoins += message.paid;
  townDeep = !!message.deep;
  Store.save(progress);
  /* The menu shows the purse, so it is redrawn when the purse changes —
     but only when the menu is really what is on screen. Every answer
     earns points, every point is sent to the property, and the property
     answers with the purse: redrawing on that alone threw the pupil out
     of the exercise they were in the middle of, back to the list of
     lessons, at each answer. */
  if (showing === "menu" && document.getElementById("property").hidden) renderMenu();
});

function goalState() {
  const day = today();
  return { done: day.n, goal: day.goal, complete: day.stamp !== null, stamp: day.stamp };
}

// A success moves the word one level up, a mistake one level down rather
// than back to zero, so a slip does not wipe out a fortnight of work.
function recordResult(word, success) {
  /* The round keeps how each of its questions went. The score at the end
     and the list of what to work on again are both read from it, rather
     than counted again by each mode — two of the four modes forgot to,
     and a faultless round of sums or of dictation ended on 0 / 10. */
  const question = state.round[state.index];
  if (question && question.word === word) {
    question.got = success;
    if (success) state.score++;
  }

  const before = recordOf(word);
  const after = {
    level: success ? Math.min(MAX_LEVEL, before.level + 1) : Math.max(0, before.level - 1),
    seen: before.seen + 1,
    ok: before.ok + (success ? 1 : 0),
    last: Date.now()
  };
  progress.words[word.key] = after;

  const note = noteReview(word);
  let gained = note.first
    ? POINTS.word + (success ? POINTS.correct : 0) +
      (state.asking === "say" || state.asking === "spell" ||
       state.asking === "count" ? POINTS.speaking : 0)
    : (success ? POINTS.again : 0);
  if (note.completed) {
    gained += POINTS.goal;
    state.stampEarned = true;
  }
  addPoints(gained);
  state.roundPoints += gained;

  Store.save(progress);
  return { before, after, gained };
}

function masteredCount(pool) {
  return pool.filter(word => recordOf(word).level >= MAX_LEVEL).length;
}

// Progress of a whole list. The bar uses the sum of the levels rather than
// the count of finished words, so it moves from the very first round instead
// of sitting at zero until a word reaches the top.
function progressOf(pool) {
  const levels = pool.reduce((sum, word) => sum + recordOf(word).level, 0);
  return {
    ratio: pool.length ? levels / (pool.length * MAX_LEVEL) : 0,
    mastered: masteredCount(pool),
    started: pool.some(word => recordOf(word).seen > 0)
  };
}

// Weight for the targeted draw: an overdue word counts most, then a weak
// one, then one left aside for a while.
function weightOf(word) {
  const record = recordOf(word);
  const days = record.last ? (Date.now() - record.last) / 86400000 : 30;
  return (isDue(word) ? 10 : 0) + (MAX_LEVEL + 1 - record.level) * 2 + Math.min(6, days);
}

// Weighted draw without replacement.
function drawWords(pool, count) {
  const remaining = pool.slice();
  const picked = [];
  while (picked.length < count && remaining.length) {
    const weights = remaining.map(weightOf);
    let target = Math.random() * weights.reduce((sum, weight) => sum + weight, 0);
    let i = 0;
    while (i < weights.length - 1 && target > weights[i]) { target -= weights[i]; i++; }
    picked.push(remaining.splice(i, 1)[0]);
  }
  return shuffle(picked);
}

// ---- Stamps ----
// One stamp per day the goal is met. The design is picked from the date, so
// it never changes once earned, and the collection stays varied.
const STAMPS = [
  { top: "VERY", bottom: "GOOD" },
  { top: "WELL", bottom: "DONE" },
  { top: "TOP", bottom: "MARKS" },
  { top: "NICE", bottom: "WORK" },
  { top: "KEEP", bottom: "GOING" },
  { top: "GOOD", bottom: "JOB" }
];

function stampFor(key) {
  let hash = 7;
  for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) % 9973;
  return hash % STAMPS.length;
}

function stampSvg(index, size) {
  const stamp = STAMPS[index % STAMPS.length];
  const tilt = ((index * 47) % 19) - 9;
  return '<svg class="stamp" viewBox="0 0 100 100" width="' + size + '" height="' + size + '" ' +
      'style="transform:rotate(' + tilt + 'deg)" role="img" aria-label="Tampon ' +
      stamp.top + ' ' + stamp.bottom + '">' +
      '<circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="3.5"/>' +
      '<circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="1.5"/>' +
      '<path d="M50 14 l2.6 5.3 5.8.8 -4.2 4.1 1 5.8 -5.2-2.7 -5.2 2.7 1-5.8 -4.2-4.1 5.8-.8z" ' +
        'fill="currentColor"/>' +
      '<text x="50" y="52" text-anchor="middle" font-size="16" font-weight="700" ' +
        'letter-spacing="1" fill="currentColor">' + stamp.top + '</text>' +
      '<text x="50" y="70" text-anchor="middle" font-size="16" font-weight="700" ' +
        'letter-spacing="1" fill="currentColor">' + stamp.bottom + '</text>' +
    '</svg>';
}

function earnedStamps() {
  return Object.entries(progress.days)
    .filter(([, day]) => day.stamp !== null && day.stamp !== undefined)
    .sort((a, b) => (a[0] < b[0] ? 1 : -1));
}

function levelDots(level) {
  let dots = "";
  for (let i = 0; i < MAX_LEVEL; i++) dots += '<span class="dot' + (i < level ? " on" : "") + '"></span>';
  return '<span class="level" role="img" aria-label="Acquis à ' + level + ' sur ' + MAX_LEVEL + '">' +
    dots + '</span>';
}

/* How well one word is known, in five dots. It deliberately avoids the
   word "niveau": that one now belongs to the hundred levels of the app,
   and a sentence cannot mean both at once. */
function levelNote(change) {
  const gained = change.gained
    ? '<span class="also gain">+' + change.gained + ' point' + (change.gained > 1 ? 's' : '') + '</span>'
    : '';
  // What was just answered, not what the pupil mostly works on: a CE2
  // who has heard an English number has not been handed a sum.
  const one = state.asking === "maths" ? "calcul" : "mot";
  const text =
    change.after.level === MAX_LEVEL ? (one === "calcul" ? "Calcul acquis." : "Mot acquis.") :
    change.after.level > change.before.level ? "Tu connais mieux ce " + one + "." :
    change.after.level < change.before.level ? "Ce " + one + " est à revoir." :
    "Ce " + one + " :";
  return '<span class="also">' + text + levelDots(change.after.level) + '</span>' + gained;
}

// ---- Speech synthesis ----
const canSpeak = "speechSynthesis" in window;
let englishVoice = null;

/* British English first, since that is what the words are taught in,
   then American, then any English at all. The tag is read loosely:
   Android writes it en_US as readily as en-US, and an exact comparison
   quietly misses the only English voice a telephone has. */
function pickVoice() {
  const voices = window.speechSynthesis.getVoices();
  englishVoice =
    voices.find(v => /^en[-_]GB/i.test(v.lang)) ||
    voices.find(v => /^en[-_]US/i.test(v.lang)) ||
    voices.find(v => /^en/i.test(v.lang)) || null;
}
if (canSpeak) {
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}

function speak(text, button) {
  if (!canSpeak) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  if (englishVoice) utterance.voice = englishVoice;
  utterance.lang = englishVoice ? englishVoice.lang : "en-GB";
  utterance.rate = 0.85;
  if (button) {
    button.classList.add("speaking");
    const clear = () => button.classList.remove("speaking");
    utterance.onend = clear;
    utterance.onerror = clear;
  }
  window.speechSynthesis.speak(utterance);
}

// ---- Speech recognition ----
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;
let micGranted = false;

if (Recognition) {
  recognition = new Recognition();
  recognition.lang = "en-US";
  recognition.interimResults = true;
  recognition.maxAlternatives = 5;
  recognition.continuous = false;
}

function embedded() {
  try { return window.self !== window.top; } catch (error) { return true; }
}

// Speech recognition alone does not always raise the browser prompt, so the
// microphone is requested explicitly and the exact blocker is reported.
async function ensureMicPermission() {
  if (micGranted) return true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(track => track.stop());
    micGranted = true;
    return true;
  } catch (error) {
    if (error.name === "NotAllowedError" || error.name === "SecurityError") {
      say.notice(embedded()
        ? "Le micro est bloqué parce que la page est dans un cadre. Ouvre-la dans son propre onglet, ou dicte la réponse ci-dessous."
        : "Le micro est refusé. Autorise-le via l'icône à gauche de l'adresse, puis recharge la page.");
    } else if (error.name === "NotFoundError") {
      say.notice("Aucun micro n'a été trouvé sur cet appareil.");
    } else if (error.name === "NotReadableError") {
      say.notice("Le micro est déjà utilisé par une autre application.");
    } else {
      say.notice("Le micro n'a pas pu démarrer.");
    }
    return false;
  }
}

// ---- Quiz state ----
const state = { mode: "mcq", lesson: null, round: [], index: 0, score: 0, locked: false,
                attempts: 0, stampEarned: false, roundPoints: 0, rankBefore: 0,
                asking: null, roundCoins: 0 };

function poolFor(lessonId) {
  if (lessonId === "*") return allWords();
  // The daily session: the words that have fallen due, oldest first. Once
  // everything is up to date it falls back to the whole set, so wanting to
  // revise more is never refused.
  if (lessonId === "!due") return allWords();
  const list = lists().find(one => one.id === lessonId);
  return list ? list.items : [];
}

function lessonTitle(lessonId) {
  if (lessonId === "*") return subject() === "maths" ? "Tout mélangé" : "Tous les mots";
  if (lessonId === "!due") return "Révision du jour";
  const list = lists().find(one => one.id === lessonId);
  return list ? list.title : "";
}

// ---- Menu ----
/* =====================================================================
   THE PROFILE SCREEN — the first thing the app shows.

   A telephone is shared, so the first question is who is holding it.
   Nothing is read from storage before that is answered: the progress,
   the property and the daily goal all belong to whoever is named here.
   ===================================================================== */

function gradeBadge(grade) {
  return '<span class="grade">' + esc(PROFILES.gradeOf(grade).fr) + '</span>';
}

function faceOf(profile, size) {
  return '<img class="face' + (size ? " " + size : "") + '" src="' +
    esc(PROFILES.iconUrl(profile.icon)) + '" alt="">';
}

/* The way out of a screen, at the right of the title. It is always the
   same button in the same place, and it always says where it goes — it
   never changes its mind about what it is. The menu is home and the
   score page has its own row of buttons, so neither offers one. */
function wayOutOf(where) {
  if (where === "round") {
    return { says: subject() === "maths" ? "Changer d'exercice" : "Changer de liste" };
  }
  if (where === "report" || where === "stamps" || where === "tweak") return { says: "Retour" };
  return null;
}

/* Who is holding the telephone, at the top of the page and nowhere
   else. The name and the face are the way to somebody else's profile:
   pressing them asks who is working now. The school year is not written
   here — it says nothing a child needs twenty times a day, and it is
   asked for and shown where profiles are chosen. Before anyone has been
   chosen there is nobody to name, so the title says where we are. */
function renderWho() {
  // An exercise takes the whole page: no name, no card, just the way out.
  document.body.classList.toggle("in-round", showing === "round");
  const out = document.getElementById("wayout");
  const way = PROFILE ? wayOutOf(showing) : null;
  out.textContent = way ? way.says : "";
  out.hidden = !way;

  if (!PROFILE) { headingEl.textContent = "Profils"; return; }
  headingEl.innerHTML =
    '<button class="who" type="button" data-switch title="Changer de profil"' +
      ' aria-label="' + esc(PROFILE.name) + ' — changer de profil">' +
      faceOf(PROFILE) + esc(PROFILE.name) +
    '</button>';
  headingEl.querySelector("[data-switch]")
    .addEventListener("click", () => renderProfiles());
}

/* ---- The telephone's own back button ----
   The app is one page, so pressing back would leave it altogether. It
   is wired to the screens instead, and goes where the screens nest:
   out of the town, out of an exercise or a report to the menu, out of
   the menu to the profiles. The profiles are the bottom — there, back
   leaves the app, which is what it is for.

   One entry of ours sits above the page and catches the first press. It
   is put back by whatever screen the press landed on, so the history
   never grows: one entry while there is somewhere to go, none once
   there is not. */
const UNDER = {
  round: "menu",
  score: "menu",
  report: "menu",
  stamps: "menu",
  tweak: "menu",
  newProfile: "profiles",
  account: "profiles",
  menu: "profiles",
  profiles: null
};

/* An entry left over from before the page was reloaded is ours to use
   again: standing on it and pushing another would stack one per
   reload. */
let trapped = !!(history.state && history.state.app);

function trapBack() {
  if (trapped) return;
  try {
    history.pushState({ app: true }, "");
    trapped = true;
  } catch (error) {
    /* A page opened from a file:// address may refuse: the back button
       then does what it always did, and nothing else breaks. */
  }
}

/* Whether the town, which covers the whole screen, still has a shop to
   close or a room to walk out of. It is the module that knows; it says
   so every time it changes. */
let townDeep = false;

function goBack() {
  const town = document.getElementById("property");
  if (!town.hidden) {
    if (townDeep && propertyFrame && propertyFrame.contentWindow) {
      propertyFrame.contentWindow.postMessage({ type: "reward:go-back" }, "*");
      trapBack();
      return true;
    }
    closeProperty();
    return true;
  }
  const under = UNDER[showing];
  if (!under) return false;
  if (under === "profiles") renderProfiles();
  else renderMenu();
  return true;
}

window.addEventListener("popstate", () => {
  // The entry that was caught is spent; whatever comes up puts one back.
  trapped = false;
  goBack();
});

/* Which screen is up is said through here, so that the way out at the
   top is never left saying the wrong thing, and the back button always
   has somewhere of ours to land. */
function nowShowing(what) {
  // Leaving a screen cancels whatever it was about to do next.
  stopMoving();
  showing = what;
  if (UNDER[what]) trapBack();
  renderWho();
}

function renderProfiles(options) {
  const asking = (options || {}).asking;
  const trouble = (options || {}).trouble;
  const people = PROFILES.all();
  /* Nobody is holding the telephone at this point: the heading goes
     back to the name of the app, rather than keeping whoever it was
     that just put it down. */
  PROFILE = null;
  // The parent's word is asked again of whoever picks the telephone up next.
  tweakOpen = false;
  nowShowing("profiles");

  if (asking || !people.length) { renderNewProfile(trouble, people.length); return; }

  screen.innerHTML =
    '<section class="card">' +
      '<p class="label">Qui travaille aujourd\'hui ?</p>' +
      '<div class="stack">' +
        people.map(one =>
          '<button class="choice is-who" data-profile="' + esc(one.id) + '">' +
            faceOf(one) + '<span class="who-name">' + esc(one.name) + '</span>' +
            gradeBadge(one.grade) +
          '</button>'
        ).join("") +
      '</div>' +
      '<p style="margin:22px 0 0">' +
        '<button class="text" data-new-profile>Nouveau profil</button>' +
      '</p>' +
    '</section>' +
    cloudCard();

  screen.querySelectorAll("[data-profile]").forEach(button => {
    button.addEventListener("click", () => startAs(button.dataset.profile));
  });
  screen.querySelector("[data-new-profile]")
    .addEventListener("click", () => renderProfiles({ asking: true }));
  hangAccount();
}

function renderNewProfile(trouble, howMany) {
  // The very first profile has nothing under it: there is no chooser yet.
  nowShowing(howMany ? "newProfile" : "profiles");
  /* The very first profile on a telephone that has been used before
     takes over what is already saved, rather than leaving it stranded
     under a key nobody reads any more. */
  const inherits = !howMany && PROFILES.legacy();

  screen.innerHTML =
    '<section class="card">' +
      '<p class="label">' + (howMany ? "Nouveau profil" : "Bienvenue !") + '</p>' +
      '<p class="label">Comment t\'appelles-tu ?</p>' +
      '<p class="spell"><input id="profile-name" type="text" autocomplete="given-name" ' +
        'maxlength="20" placeholder="Ton prénom" aria-label="Ton prénom"></p>' +
      '<p class="label">Choisis ton image</p>' +
      '<div class="faces" id="profile-icons">' +
        PROFILES.ICONS.map((icon, index) =>
          '<button class="face-pick" data-icon="' + esc(icon.id) + '"' +
            ' title="' + esc(icon.fr) + '" aria-label="' + esc(icon.fr) + '"' +
            ' aria-pressed="' + (index === 0 ? "true" : "false") + '">' +
            '<img src="' + esc(PROFILES.iconUrl(icon.id)) + '" alt="">' +
          '</button>'
        ).join("") +
      '</div>' +
      '<p class="label">Tu es...</p>' +
      '<div class="stack" id="profile-grades">' +
        PROFILES.GRADES.map(grade =>
          '<button class="choice" data-grade="' + esc(grade.id) + '"' +
            ' aria-pressed="' + (grade.id === "6eme") + '">' +
            esc(grade.fr) + '<span class="sub">' + esc(grade.sub) + '</span>' +
          '</button>'
        ).join("") +
      '</div>' +
      (inherits
        ? '<p class="label" style="margin-top:22px">La progression déjà enregistrée sur ce ' +
          'téléphone — les niveaux, les mots, la ville — sera la tienne.</p>'
        : '') +
      (trouble ? '<p class="notice">' + esc(trouble) + '</p>' : '') +
      '<p style="margin:22px 0 0">' +
        '<button class="text primary" data-make>C\'est parti</button>' +
        (howMany ? ' <button class="text" data-cancel>Annuler</button>' : '') +
      '</p>' +
    '</section>' +
    /* A second telephone in the house opens here too: its family is
       already on the account, and is found by signing in rather than
       by making everybody again. */
    (!howMany && !CLOUD.status().signedIn ? cloudCard(true) : '');

  /* One of a row is chosen at a time: pressing one lets the others go.
     The same for the drawings and for the school years. */
  function pickOne(box, mark) {
    box.addEventListener("click", event => {
      const button = event.target.closest("[" + mark + "]");
      if (!button) return;
      box.querySelectorAll("[" + mark + "]").forEach(one => {
        one.setAttribute("aria-pressed", String(one === button));
      });
    });
  }

  const grades = screen.querySelector("#profile-grades");
  const icons = screen.querySelector("#profile-icons");
  pickOne(grades, "data-grade");
  pickOne(icons, "data-icon");

  const field = screen.querySelector("#profile-name");
  const make = () => {
    const year = grades.querySelector('[aria-pressed="true"]');
    const face = icons.querySelector('[aria-pressed="true"]');
    const profile = PROFILES.create(field.value,
      year && year.dataset.grade, face && face.dataset.icon);
    if (!profile) {
      renderProfiles({ asking: true, trouble: "Il manque le prénom." });
      screen.querySelector("#profile-name").focus();
      return;
    }
    startAs(profile.id);
  };
  screen.querySelector("[data-make]").addEventListener("click", make);
  field.addEventListener("keydown", event => { if (event.key === "Enter") make(); });
  const cancel = screen.querySelector("[data-cancel]");
  if (cancel) cancel.addEventListener("click", () => renderProfiles());
  hangAccount();
  field.focus();
}

/* Takes up a profile and opens its menu. Everything that was on screen
   belonged to whoever came before, so it is all read again. */
async function startAs(id) {
  const profile = PROFILES.choose(id);
  if (!profile) { renderProfiles(); return; }
  PROFILE = profile;
  renderWho();
  progress = DEMO_RANK ? demoProgress(DEMO_RANK) : await Store.load();
  // The property belongs to the profile too: the next open reloads it.
  dropProperty();
  renderMenu();
}

/* =====================================================================
   THE FAMILY ACCOUNT — a copy of everything on a server.

   Everything is saved on the telephone first, account or not. Signed
   in, cloud.js keeps a copy on the family account as well, so the work
   survives a lost telephone and follows the children from one device
   to another. A parent sets it up once per telephone; the children
   never see more of it than a line under their names.
   ===================================================================== */

/* How the copy stands, in a sentence. */
function cloudSays(now) {
  if (!now.signedIn) return now.trouble || "Tout est enregistré sur ce téléphone seulement.";
  if (now.busy) return "Synchronisation en cours…";
  if (now.trouble) return now.trouble;
  if (now.pending) {
    return now.pending + (now.pending > 1 ? " changements attendent" : " changement attend") +
      " d'être envoyés : ils partiront dès que possible.";
  }
  if (!now.synced) return "Connecté, pas encore synchronisé.";
  return "Tout est sauvegardé en ligne.";
}

/* The line under the profiles, and the way to the account. On the very
   first screen of a telephone, it is the way in for a family that is
   already on the account. */
function cloudCard(welcome) {
  const now = CLOUD.status();
  return '<section class="card" style="margin-top:16px">' +
      (welcome
        ? '<p class="label">Déjà un compte famille ? Connecte-toi, et tous les profils ' +
            'reviennent sur ce téléphone.</p>'
        : '<p class="label" data-cloud-line>' + esc(cloudSays(now)) + '</p>') +
      '<p style="margin:0">' +
        '<button class="text quiet" data-account>' +
          (welcome ? "Se connecter" : now.signedIn ? "Compte famille" : "Sauvegarder en ligne") +
        '</button>' +
      '</p>' +
    '</section>';
}

function hangAccount() {
  const button = screen.querySelector("[data-account]");
  if (button) button.addEventListener("click", () => renderAccount());
}

/* The account screen. Signed out, it signs in or makes the account;
   signed in, it says how the copy stands. Arriving from a "forgotten
   password" email, it asks for the new one. `options.fine` and
   `options.trouble` are a message to show, good or bad. */
function renderAccount(options) {
  const opts = options || {};
  nowShowing("account");
  const now = CLOUD.status();
  const message = opts.trouble
    ? '<p class="notice" data-cloud-message>' + esc(opts.trouble) + '</p>'
    : opts.fine
      ? '<p class="notice fine" data-cloud-message>' + esc(opts.fine) + '</p>'
      : '<p class="notice" data-cloud-message hidden></p>';
  const field = (id, type, complete, label) =>
    '<p class="label">' + label + '</p>' +
    '<p class="spell"><input id="' + id + '" type="' + type + '" autocomplete="' + complete + '"' +
      (type === "email" ? ' inputmode="email" autocapitalize="off" spellcheck="false"' : '') +
      ' aria-label="' + label + '"></p>';
  const back = '<p class="actions after"><button class="text quiet" data-back>Retour</button></p>';

  if (now.signedIn && opts.recovery) {
    screen.innerHTML =
      '<section class="card">' +
        '<p class="label"><b>Nouveau mot de passe</b></p>' +
        '<p class="label">Pour le compte ' + esc(now.email) + '.</p>' +
        field("cloud-password", "password", "new-password", "Mot de passe (6 caractères au moins)") +
        message +
        '<p class="actions"><button class="text primary" data-new-password>Enregistrer</button></p>' +
        back +
      '</section>';
  } else if (now.signedIn) {
    screen.innerHTML =
      '<section class="card">' +
        '<p class="label"><b>Compte famille</b></p>' +
        '<p class="label">Connecté avec <b>' + esc(now.email) + '</b>. Le travail de chacun ' +
          'est sauvegardé en ligne, et se retrouve sur chaque téléphone connecté à ce compte.</p>' +
        '<p class="label" data-cloud-line>' + esc(cloudSays(now)) + '</p>' +
        message +
        '<p class="actions">' +
          '<button class="text primary" data-sync>Synchroniser maintenant</button>' +
          '<button class="text" data-sign-out>Se déconnecter</button>' +
        '</p>' +
        back +
      '</section>';
  } else {
    screen.innerHTML =
      '<section class="card">' +
        '<p class="label"><b>Compte famille</b></p>' +
        '<p class="label">Avec un compte, le travail de chacun est sauvegardé en ligne : il ne se ' +
          'perd pas avec le téléphone, et se retrouve sur tous les téléphones de la maison.</p>' +
        field("cloud-email", "email", "username", "Adresse email") +
        field("cloud-password", "password", "current-password", "Mot de passe") +
        message +
        '<p class="actions">' +
          '<button class="text primary" data-sign-in>Se connecter</button>' +
          '<button class="text" data-sign-up>Créer le compte</button>' +
        '</p>' +
        '<p class="actions after">' +
          '<button class="text quiet" data-forgot>Mot de passe oublié</button>' +
          '<button class="text quiet" data-back>Retour</button>' +
        '</p>' +
      '</section>';
  }

  const find = selector => screen.querySelector(selector);
  const value = id => (find("#" + id) || {}).value || "";
  const say = (text, fine) => {
    const box = find("[data-cloud-message]");
    box.textContent = text;
    box.className = "notice" + (fine ? " fine" : "");
    box.hidden = !text;
  };
  /* One request at a time: the buttons wait with it, and whatever it
     answers is said under the fields. */
  const act = (selector, work) => {
    const button = find(selector);
    if (!button) return;
    button.addEventListener("click", async () => {
      const buttons = screen.querySelectorAll("button");
      buttons.forEach(one => { one.disabled = true; });
      say("");
      try {
        await work();
      } catch (error) {
        if (showing === "account") say(error.message || "Ça n'a pas marché.");
      } finally {
        buttons.forEach(one => { one.disabled = false; });
      }
    });
  };
  const needs = (email, password) => {
    if (email !== undefined && !/^\S+@\S+\.\S+$/.test(email.trim())) {
      throw new Error("Il manque l'adresse email.");
    }
    if (password !== undefined && password.length < 6) {
      throw new Error("Le mot de passe doit faire 6 caractères au moins.");
    }
  };

  act("[data-sign-in]", async () => {
    needs(value("cloud-email"), value("cloud-password"));
    await CLOUD.signIn(value("cloud-email"), value("cloud-password"));
    // Whoever is on the account is now on this telephone as well.
    if (showing === "account") renderProfiles();
  });
  act("[data-sign-up]", async () => {
    needs(value("cloud-email"), value("cloud-password"));
    const made = await CLOUD.signUp(value("cloud-email"), value("cloud-password"));
    if (made.confirm) {
      say("Un email vient d'être envoyé à " + value("cloud-email").trim() + ". Ouvre le lien " +
        "qu'il contient sur ce téléphone : tu reviendras ici, connecté.", true);
    } else if (showing === "account") {
      renderAccount({ fine: "Le compte famille est prêt : tout ce qui est sur ce téléphone y est sauvegardé." });
    }
  });
  act("[data-forgot]", async () => {
    needs(value("cloud-email"));
    await CLOUD.recover(value("cloud-email"));
    say("Si un compte existe pour cette adresse, un email vient d'y être envoyé : " +
      "ouvre le lien qu'il contient sur ce téléphone pour choisir un nouveau mot de passe.", true);
  });
  act("[data-new-password]", async () => {
    needs(undefined, value("cloud-password"));
    await CLOUD.setPassword(value("cloud-password"));
    renderAccount({ fine: "Le nouveau mot de passe est enregistré." });
  });
  act("[data-sync]", async () => {
    await CLOUD.sync();
    const after = CLOUD.status();
    if (after.trouble) throw new Error(after.trouble);
  });
  act("[data-sign-out]", async () => {
    await CLOUD.signOut();
    renderAccount({ fine: "Déconnecté. Tout ce qui est sur ce téléphone y reste." });
  });
  const leave = find("[data-back]");
  if (leave) leave.addEventListener("click", () => renderProfiles());

  const first = find("#cloud-email") || find("#cloud-password");
  if (first) first.focus();
  window.scrollTo(0, 0);
}

/* Whatever says how the copy stands follows it as it changes, without
   redrawing the screen under somebody's fingers. */
CLOUD.onStatus(now => {
  document.querySelectorAll("[data-cloud-line]").forEach(line => {
    line.textContent = cloudSays(now);
  });
});

/* Saves that came down from the family account. The profile being used
   may have been given a new id, or its progress or its property may
   have moved on on another telephone: what is held in memory is read
   again, and the screen redrawn where that is safe to do. */
CLOUD.onChange(change => {
  if (PROFILE) {
    const id = change.renamed[PROFILE.id] || PROFILE.id;
    const moved = id !== PROFILE.id;
    PROFILE = PROFILES.one(id) || PROFILE;
    if (!DEMO_RANK && (moved || change.keys.includes(storeKey()))) {
      try {
        const raw = localStorage.getItem(storeKey());
        progress = Store.adopt(raw ? JSON.parse(raw) : null);
      } catch (error) {
        /* The one in memory stays: it is newer than nothing. */
      }
    }
    if (moved || change.keys.includes(PROFILES.keyFor("reward-property-v1", PROFILE.id))) {
      reloadProperty();
    }
    renderWho();
  }
  // A form being filled in is never redrawn from under the pupil.
  if (showing === "profiles" && !document.getElementById("profile-name")) renderProfiles();
  else if (showing === "menu" && document.getElementById("property").hidden) renderMenu();
});

/* Which of the screens is up. The property answers with the purse
   whenever anything is sent to it, and the menu has to be redrawn to
   show it — but only the menu, and only when it is the screen the pupil
   is looking at. */
let showing = null;

/* ---- The grown-up's menu ----
   A parent has nothing to revise and no town to build: what they came
   for is the children's books. One line each, and a press opens the
   book — with the tally and the dates a parent actually wants, which a
   child's own report leaves out. */
function renderParentMenu() {
  const children = PROFILES.all().filter(one => !PROFILES.grown(one.grade));
  screen.innerHTML =
    '<section class="card">' +
      '<p class="label">' + (children.length
        ? 'Le travail de chacun'
        : 'Aucun enfant sur ce téléphone pour l\'instant.') + '</p>' +
      (children.length
        ? '<div class="stack">' + children.map(one => {
            const book = bookOf(one.id);
            const rank = RANKS.of(book.points || 0);
            return '<button class="choice is-who" data-book="' + esc(one.id) + '">' +
              faceOf(one) + '<span class="who-name">' + esc(one.name) +
                '<span class="sub">Niveau ' + rank.index + ' · ' +
                  (book.points || 0) + ' points</span>' +
              '</span>' + gradeBadge(one.grade) +
            '</button>';
          }).join("") + '</div>'
        : '<p class="label">Crée le profil d\'un enfant, puis reviens ici.</p>') +
      (children.length
        ? '<div class="actions"><button class="text quiet" id="tweak">' +
            'Modifier un niveau ou des pièces</button></div>'
        : '') +
    '</section>';

  screen.querySelectorAll("[data-book]").forEach(button => {
    button.addEventListener("click", () => renderReport(button.dataset.book));
  });
  const tweak = document.getElementById("tweak");
  if (tweak) tweak.addEventListener("click", () => renderTweak());
  window.scrollTo(0, 0);
}

/* ---- The grown-up's hand on a child's level and purse ----
   A level up, or a hundred coins, given by a parent rather than earned.
   The screen is behind a word written right here in the source: it
   keeps a child who wandered onto the parent's profile out, and it
   protects nothing more than that.

   A level is a number of points (ranks.js), so a level up is the
   points of the next one. The coins are the town's, in its own save:
   the hundred go straight into its purse. Whatever the level up is
   worth in coins is paid by the town itself, the next time it wakes,
   exactly as for a level earned — it never pays a level twice. */
const TWEAK_WORD = "girafe";
const TWEAK_COINS = 100;
const TOWN_PLAIN = "reward-property-v1";
// What a town holds before its first visit: START_COINS in reward/js/state.js.
const TOWN_START = 150;

// The word is asked once, and again whenever the telephone changes hands.
let tweakOpen = false;
let tweaking = null;

function townOf(id) {
  try {
    const saved = JSON.parse(localStorage.getItem(PROFILES.keyFor(TOWN_PLAIN, id)));
    return saved && typeof saved === "object" ? saved : null;
  } catch (error) {
    return null;
  }
}

function coinsOf(id) {
  const town = townOf(id);
  return town ? Math.max(0, Math.round(Number(town.coins) || 0)) : TOWN_START;
}

function writeBook(id, book) {
  const key = PROFILES.keyFor(STORE_PLAIN, id);
  localStorage.setItem(key, JSON.stringify(book));
  CLOUD.touched(key);
}

/* The points of the next level. The family account merges two books by
   keeping the larger total, so the level holds on every telephone. */
function giveLevel(id) {
  const book = bookOf(id);
  const rank = RANKS.of(book.points || 0);
  if (rank.last) return null;
  book.points = rank.next;
  writeBook(id, book);
  return rank.index + 1;
}

/* Straight into the town's purse. A town never visited has no save yet:
   it gets one holding only its purse, which the module reads like any
   save it has no step for — the coins are kept, the rest starts blank.
   The book keeps its copy of the purse in step, for the child's menu. */
function giveCoins(id, amount) {
  const key = PROFILES.keyFor(TOWN_PLAIN, id);
  const town = townOf(id) || { coins: TOWN_START };
  town.coins = coinsOf(id) + amount;
  localStorage.setItem(key, JSON.stringify(town));
  CLOUD.touched(key);
  const book = bookOf(id);
  book.reward.coins = town.coins;
  writeBook(id, book);
  return town.coins;
}

function renderTweak(said) {
  nowShowing("tweak");
  if (!tweakOpen) {
    screen.innerHTML =
      '<section class="card">' +
        '<p class="label"><b>Modifier un profil</b></p>' +
        '<p class="label">Mot de passe</p>' +
        '<p class="spell"><input id="tweak-word" type="password" autocomplete="off"' +
          ' autocapitalize="off" spellcheck="false" aria-label="Mot de passe"></p>' +
        (said ? '<p class="notice">' + esc(said) + '</p>' : '') +
        '<p class="actions"><button class="text primary" data-tweak-enter>Entrer</button></p>' +
      '</section>';
    const field = document.getElementById("tweak-word");
    const enter = () => {
      if (field.value.trim().toLowerCase() !== TWEAK_WORD) {
        renderTweak("Ce n'est pas le bon mot de passe.");
        return;
      }
      tweakOpen = true;
      renderTweak();
    };
    screen.querySelector("[data-tweak-enter]").addEventListener("click", enter);
    field.addEventListener("keydown", event => { if (event.key === "Enter") enter(); });
    field.focus();
    window.scrollTo(0, 0);
    return;
  }

  const children = PROFILES.all().filter(one => !PROFILES.grown(one.grade));
  if (!children.some(one => one.id === tweaking)) tweaking = children.length ? children[0].id : null;
  const chosen = children.find(one => one.id === tweaking);
  const rank = chosen ? RANKS.of(bookOf(chosen.id).points || 0) : null;

  screen.innerHTML =
    '<section class="card">' +
      '<p class="label"><b>Modifier un profil</b></p>' +
      (children.length
        ? '<div class="stack">' + children.map(one =>
            '<button class="choice is-who" data-tweak-who="' + esc(one.id) + '"' +
              ' aria-pressed="' + (one.id === tweaking) + '">' +
              faceOf(one) + '<span class="who-name">' + esc(one.name) + '</span>' +
              gradeBadge(one.grade) +
            '</button>').join("") + '</div>'
        : '<p class="label">Aucun enfant sur ce téléphone pour l\'instant.</p>') +
    '</section>' +
    (chosen
      ? '<section class="card rank">' +
          '<p class="label" style="margin-bottom:2px"><b>' + esc(chosen.name) + '</b> — Niveau ' +
            rank.index + ' sur ' + RANKS.COUNT + '</p>' +
          '<p class="purse"><img src="reward/assets/coin.svg" alt="pièces">' +
            coinsOf(chosen.id) + ' pièces</p>' +
          (said ? '<p class="notice fine" data-tweak-said>' + esc(said) + '</p>' : '') +
          '<div class="actions">' +
            '<button class="text primary" data-level-up' + (rank.last ? ' disabled' : '') + '>' +
              (rank.last ? 'Dernier niveau atteint' : 'Passer au niveau ' + (rank.index + 1)) +
            '</button>' +
            '<button class="text" data-coins>+' + TWEAK_COINS + ' pièces</button>' +
          '</div>' +
        '</section>'
      : '');

  screen.querySelectorAll("[data-tweak-who]").forEach(button => {
    button.addEventListener("click", () => {

    });
  });

  if (up) up.addEventListener("click", () => {

  });

/* Where the pupil stands. The bar fills towards the next level rather
   than showing a raw total, so progress is visible even between two of
   them. The level has no name of its own on show: a rank called
   "Seedling" told a child nothing. */
function levelLine() {
  const rank = rankOf(progress.points);
  return '<p class="label" style="margin-bottom:2px">Niveau ' + rank.index +
      ' sur ' + RANKS.COUNT + '</p>' +
    '<span class="bar"><span style="width:' +
      Math.max(2, Math.round(rank.ratio * 100)) + '%"></span></span>' +
    '<span class="done">' + progress.points + ' points' +
      (rank.last
        ? ' · niveau maximum'
        : ' · encore ' + rank.toGo + ' avant le niveau ' + (rank.index + 1)) +
    '</span>';
}

/* ---- Where the pupil stands, and the town it pays for ----
   A level is worth coins in the town, so the two are one card and not
   two: the level reached, and the purse it has filled.

   The purse is the one the module last reported, and it is shown as it
   is. What a level has earned but not yet been paid is not written
   here: only the module knows its own prices, and it settles up the
   moment the town is opened. */
function standingCard() {
  const purse = progress.reward || { coins: 0, level: 0, stamps: 0 };
  return '<section class="card rank">' +
      levelLine() +
      '<p class="purse"><img src="reward/assets/coin.svg" alt="pièces">' +
        purse.coins + ' pièces</p>' +
      '<div class="actions">' +
        '<button class="text primary" id="open-property">Ouvrir ma ville</button>' +
      '</div>' +
    '</section>';
}
